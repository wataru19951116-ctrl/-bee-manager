<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5b400">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>🐝 養蜂管理</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--ink:#222;--muted:#777;--accent:#f5b400;--line:#e8e8e3;--danger:#d9534f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:84px}header{padding:18px 18px 10px;background:var(--card);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0}.date{font-size:13px;color:var(--muted);margin-top:4px}main{padding:16px}.section-title{font-weight:700;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{font-size:22px;display:block;margin-top:4px}
.muted{color:var(--muted);font-size:13px}button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;background:var(--accent);color:#222}button.secondary{background:#eee}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}
.nav button{background:transparent;border-radius:0;flex:1;max-width:180px;font-size:12px;color:#666;padding:10px 4px 12px}.nav button.active{color:#111}.nav span{display:block;font-size:21px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;background:#fff;font-size:16px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.hive{margin-bottom:10px}.hive-head{display:flex;justify-content:space-between;align-items:center}.badge{padding:5px 8px;border-radius:99px;background:#fff3c7;font-size:12px}
.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.hidden{display:none!important}.back{margin-bottom:12px}.photo-preview{max-width:100%;border-radius:12px;margin-top:8px}
.small{font-size:12px}.danger{color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:30px 10px}.hint{font-size:12px;color:var(--muted);margin-top:6px}
.flow-wrap{margin-top:12px}.flow-title{font-weight:700;margin-bottom:8px}.flow-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.flow-item{min-width:76px;text-align:center}.flow-frame{height:116px;border:4px solid #9b6b32;border-radius:8px;background:#f5f0df;position:relative;padding:7px 5px;box-shadow:inset 0 0 0 2px #d5b57c}
.flow-frame:before,.flow-frame:after{content:"";position:absolute;left:11px;right:11px;height:2px;background:#c9a86f}.flow-frame:before{top:34px}.flow-frame:after{top:68px}
.flow-frame .honey{position:absolute;left:9px;right:9px;bottom:9px;height:0;border-radius:5px;background:#f5b400;opacity:.85}
.flow-frame[data-level="少ない"] .honey{height:18%}.flow-frame[data-level="半分"] .honey{height:43%}.flow-frame[data-level="多い"] .honey{height:68%}.flow-frame[data-level="満杯"] .honey{height:88%}
.flow-label{font-size:12px;font-weight:700;margin-top:4px}.flow-level{font-size:11px;color:var(--muted);margin-top:2px}
.box-stack{display:flex;flex-direction:column;gap:4px;margin-top:10px}.box-tier{height:38px;border:2px solid #9b6b32;border-radius:6px;background:#eee8d6;display:flex;align-items:center;justify-content:center;font-size:12px}.box-tier.built{background:#f5d36b;font-weight:700}.box-tier.selected{outline:3px solid #f5b400;background:#ffe9a3}.box-tier.selected span{font-weight:900}
.work-choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.work-choice button{background:#eee}.work-choice button.selected{background:var(--accent)}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid #ddd;border-radius:10px;padding:10px;background:#fff}.check input{width:auto;margin-right:6px}
</style>
</head>
<body>
<div class="app">
<header><h1>🐝 養蜂管理</h1><div class="date" id="today"></div></header>
<main id="main"></main>
<nav class="nav">
<button data-tab="home" class="active">🏠<span>ホーム</span></button>
<button data-tab="records">📝<span>記録</span></button>
<button data-tab="calendar">📅<span>予定</span></button>
</nav>
</div>
<script>
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
const KEY="beeManagerV1";
let data=JSON.parse(localStorage.getItem(KEY)||'{"hives":[],"records":[],"tasks":[]}');
data.hives=(data.hives||[]).map(h=>({...h,realTiers:Number(h.realTiers||0),builtTiers:Number(h.builtTiers||0),flowHive:!!h.flowHive,flowCount:Number(h.flowCount||0),flowLevels:Array.isArray(h.flowLevels)?h.flowLevels:[]}));
data.records=(data.records||[]).map(r=>({...r,workType:r.workType||"inspection",realTiers:Number(r.realTiers||0),builtTiers:Number(r.builtTiers||0),flowHive:!!r.flowHive,flowCount:Number(r.flowCount||0),flowLevels:Array.isArray(r.flowLevels)?r.flowLevels:[]}));
let currentTab="home",editingHive=null,selectedHive=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const today=()=>new Date().toISOString().slice(0,10);
document.getElementById("today").textContent=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab));const m=document.getElementById("main");if(currentTab==="home")hives(m);else if(currentTab==="hives")hives(m);else if(currentTab==="records")records(m);else calendar(m)}
function home(m){hives(m)}
function hives(m){if(editingHive!==null){hiveForm(m);return}m.innerHTML=`<div class="row"><div><h2 style="margin:0">🐝 巣箱 ${data.hives.length}群</h2><div class="muted">巣箱の状況はこのホームで確認できます</div></div><button onclick="addHive()">＋ 追加</button></div><div style="margin-top:14px">${data.hives.length?data.hives.map(hiveCard).join(""):'<div class="card empty">まだ巣箱がありません。<br>「＋ 追加」から登録できます。</div>'}</div>`}
function stackHtml(real,built){return Array.from({length:real},(_,i)=>`<div class="box-tier ${i<built?"built":""}">${i<built?"巣あり":"空段"}・${i+1}段目</div>`).join("")}
function flowHtml(h,onclickMode=true){return h.flowHive?`<div class="flow-wrap"><div class="flow-title">🍯 フローハイブ ${h.flowCount}基</div><div class="flow-row">${Array.from({length:h.flowCount},(_,i)=>flowMini(h,i,onclickMode)).join("")}</div></div>`:'<div class="hint" style="margin-top:10px">フローハイブ：なし</div>'}
function flowMini(h,i,clickable=true){const level=(h.flowLevels||[])[i]||"空";return `<div class="flow-item" ${clickable?`onclick="cycleFlow('${h.id}',${i})"`:""}><div class="flow-frame" data-level="${esc(level)}"><div class="honey"></div></div><div class="flow-label">基 ${i+1}</div><div class="flow-level">${esc(level)}</div></div>`}
function hiveCard(h){const rs=data.records.filter(r=>r.hiveId===h.id).sort((a,b)=>b.date.localeCompare(a.date));const last=rs[0];const real=Number(h.realTiers||0),built=Math.min(Number(h.builtTiers||0),real);return `<div class="card hive"><div class="hive-head"><b>🐝 ${esc(h.name)}</b><span class="badge">${esc(h.status||"未設定")}</span></div><div class="muted">設置場所：${esc(h.place||"未設定")}</div>${h.flowHive?flowHtml(h,false):""}<div class="box-stack">${stackHtml(real,built)||'<div class="hint">重箱の段数未設定</div>'}</div><div class="small" style="margin-top:8px">最終作業：${last?esc(last.date):"まだなし"}</div><div class="actions"><button onclick="newRecord('${h.id}')">＋ 作業登録</button><button class="secondary" onclick="editHive('${h.id}')">編集</button></div></div>`}
function cycleFlow(id,i){const h=data.hives.find(x=>x.id===id);if(!h)return;const seq=["空","少ない","半分","多い","満杯"];h.flowLevels=h.flowLevels||[];h.flowLevels[i]=seq[(seq.indexOf(h.flowLevels[i]||"空")+1)%seq.length];save();render()}
function hiveForm(m){const isNew=editingHive==="new";const h=isNew?{}:data.hives.find(x=>x.id===editingHive)||{};m.innerHTML=`<button class="secondary back" onclick="editingHive=null;render()">← 戻る</button><h2>${isNew?"巣箱を追加":"巣箱情報を編集"}</h2><div class="hint">${isNew?"新規追加時は現在の巣箱状況も入力できます。登録後の状況変更は作業登録から行います。":"巣箱の状況は作業登録から変更します。"}</div><label>巣箱名・番号</label><input id="hn" value="${esc(h.name||"")}" placeholder="例：巣箱01"><label>設置場所</label><input id="hp" value="${esc(h.place||"")}" placeholder="例：○○畑">${isNew?`<div class="section-title">初期の巣箱状況</div><label>群の状態</label><select id="hs"><option>未設定</option><option>強群</option><option>普通</option><option>弱群</option></select><label>重箱の実段数</label><input id="hreal" type="number" min="0" max="20" value="0"><label>巣が出来ている段数（上から）</label><input id="hbuilt" type="number" min="0" max="20" value="0"><label>フローハイブ設置基数</label><input id="hfc" type="number" min="0" max="10" value="0"><div id="newFlowArea"></div>`:''}<label>メモ</label><textarea id="hm" rows="4">${esc(h.memo||"")}</textarea><button style="width:100%;margin-top:14px" onclick="saveHive()">保存</button>`;if(isNew){document.getElementById("hfc").oninput=updateNewFlow;updateNewFlow()}}
function updateNewFlow(){const a=document.getElementById("newFlowArea"),n=Math.max(0,Number(document.getElementById("hfc")?.value||0));a.innerHTML=n?`<label>各フローハイブの初期貯蜜状況</label><div class="flow-row">${Array.from({length:n},(_,i)=>`<div class="flow-item"><div class="flow-frame" id="nf${i}" data-level="空" onclick="cycleNewFlow(${i})"><div class="honey"></div></div><div class="flow-label">基 ${i+1}</div><div class="flow-level" id="nfl${i}">空</div></div>`).join("")}</div>`:""}
function cycleNewFlow(i){const e=document.getElementById("nf"+i),l=document.getElementById("nfl"+i),seq=["空","少ない","半分","多い","満杯"],n=seq[(seq.indexOf(e.dataset.level)+1)%seq.length];e.dataset.level=n;l.textContent=n}
function addHive(){editingHive="new";currentTab="hives";render()}
function editHive(id){editingHive=id;render()}
function saveHive(){const name=document.getElementById("hn").value.trim();if(!name)return alert("巣箱名・番号を入力してください");const isNew=editingHive==="new",old=isNew?{}:(data.hives.find(x=>x.id===editingHive)||{});let real=isNew?Math.max(0,Number(document.getElementById("hreal")?.value||0)):Number(old.realTiers||0),built=isNew?Math.min(real,Math.max(0,Number(document.getElementById("hbuilt")?.value||0))):Number(old.builtTiers||0),fc=isNew?Math.max(0,Number(document.getElementById("hfc")?.value||0)):Number(old.flowCount||0),levels=isNew?Array.from({length:fc},(_,i)=>document.getElementById("nf"+i)?.dataset.level||"空"):(Array.isArray(old.flowLevels)?old.flowLevels:[]);const obj={id:isNew?crypto.randomUUID():editingHive,name,place:document.getElementById("hp").value,memo:document.getElementById("hm").value,status:isNew?(document.getElementById("hs")?.value||"未設定"):(old.status||"未設定"),realTiers:real,builtTiers:Math.min(built,real),flowHive:fc>0,flowCount:fc,flowLevels:levels};if(isNew)data.hives.push(obj);else data.hives[data.hives.findIndex(x=>x.id===editingHive)]=obj;save();editingHive=null;render()}
function viewHive(id){selectedHive=id;const h=data.hives.find(x=>x.id===id);const rs=data.records.filter(r=>r.hiveId===id).sort((a,b)=>b.date.localeCompare(a.date));const real=Number(h.realTiers||0),built=Math.min(Number(h.builtTiers||0),real);document.getElementById("main").innerHTML=`<button class="secondary back" onclick="selectedHive=null;render()">← 巣箱一覧</button><div class="card"><h2 style="margin-top:0">🐝 ${esc(h.name)}</h2><div>場所：${esc(h.place||"-")}</div><div>状態：${esc(h.status||"-")}</div>${flowHtml(h,true)}<div style="margin-top:10px"><b>重箱</b>：実段数 ${real}段／巣あり ${built}段（上から）</div><div class="box-stack">${stackHtml(real,built)||'<div class="hint">未設定</div>'}</div><div class="muted" style="margin-top:10px">${esc(h.memo||"")}</div></div><div class="section-title">作業履歴</div>${rs.length?rs.map(recordCard).join(""):'<div class="card empty">記録なし</div>'}<button style="width:100%;margin-top:10px" onclick="newRecord('${id}')">＋ この巣箱の作業を記録</button>`}
function workLabel(t){return({inspection:"内検",harvest:"採蜜",addbox:"次箱",medicine:"薬設置",remove:"撤去",move:"移動"})[t]||"内検"}
function workLabelMulti(ts){return (ts||[]).map(workLabel).join("＋")||"内検"}
function recordCard(r){const h=data.hives.find(x=>x.id===r.hiveId);const types=r.workTypes||[r.workType||"inspection"];return `<div class="card" style="margin-bottom:10px"><div class="hive-head"><b>${esc(r.date)}　${esc(h?.name||"削除済み")}</b><span class="badge">${esc(workLabelMulti(types))}</span></div>${types.includes("inspection")?`<div class="muted">内検：群 ${esc(r.status||h?.status||"未設定")}／巣あり ${Number(r.builtTiers||0)}段（上から）</div>`:""}${r.harvestBoxes?`<div class="small">採蜜：重箱 ${r.harvestBoxes}箱</div>`:""}${r.harvestFlows?.length?`<div class="small">採蜜：フローハイブ ${r.harvestFlows.map(i=>`基${i+1}`).join("、")}（貯蜜を空にしました）</div>`:""}${r.addBoxes?`<div class="small">次箱：重箱＋${r.addBoxes}箱</div>`:""}${r.addFlows?`<div class="small">次箱：フローハイブ＋${r.addFlows}基</div>`:""}${r.removeBoxes?.length?`<div class="small">撤去：重箱 ${r.removeBoxes.map(i=>`${i}段目`).join("、")}</div>`:""}${r.removeFlows?.length?`<div class="small">撤去：フローハイブ ${r.removeFlows.map(i=>`基${i+1}`).join("、")}</div>`:""}${r.medicineName?`<div class="small">薬：${esc(r.medicineName)} ${esc(r.medicineAmount||"")}／設置場所：${esc(r.medicinePlace||"")}</div>`:""}${r.movePlace?`<div class="small">移動：${esc(r.moveGroupSize||"")} → ${esc(r.movePlace)}</div>`:""}${r.feed?`<div class="small">給餌：${esc(r.feed)}</div>`:""}<div class="small">${esc(r.memo||"")}</div>${(r.photos||[]).filter(Boolean).map(p=>`<img class="photo-preview" src="${p}">`).join("")}</div>`}
function records(m){const rs=[...data.records].sort((a,b)=>b.date.localeCompare(a.date));m.innerHTML=`<div class="row"><div><h2 style="margin:0">記録</h2><div class="muted">作業をまとめて記録できます</div></div><button onclick="newRecord()">＋ 記録</button></div><div style="margin-top:14px">${rs.length?rs.map(recordCard).join(""):'<div class="card empty">まだ記録がありません。</div>'}</div>`}
function newRecord(hiveId){const m=document.getElementById("main");currentTab="records";const h=data.hives.find(x=>x.id===hiveId)||data.hives[0];m.innerHTML=`<button class="secondary back" onclick="render()">← 戻る</button><h2>📝 作業を登録</h2><label>巣箱</label><select id="rh">${data.hives.map(x=>`<option value="${x.id}" ${x.id===h.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select><label>作業（複数選択可）</label><div class="work-choice">${[["inspection","内検"],["harvest","採蜜"],["addbox","次箱"],["medicine","薬設置"],["remove","撤去"],["move","移動"]].map(([t,l])=>`<button id="wt-${t}" onclick="toggleWork('${t}')">${l}</button>`).join("")}</div><div class="hint">採蜜・次箱・薬設置・撤去・移動を選ぶと、内検も同時に記録します。内検だけの場合は内検のみです。</div><label>日付</label><input id="rd" type="date" value="${today()}"><label>天気</label><select id="rw"><option>☀️ 晴れ</option><option>☁️ 曇り</option><option>🌧️ 雨</option></select><label>気温（℃）</label><input id="rt" type="number" placeholder="28"><div id="inspectionArea"></div><div id="workArea"></div><div id="photoArea"></div><label>メモ</label><textarea id="rm" rows="5" placeholder="気になったことなど"></textarea><button style="width:100%;margin-top:14px" onclick="saveRecord()">記録する</button>`;window.selectedWorks=["inspection"];document.getElementById("wt-inspection").classList.add("selected");document.getElementById("rh").onchange=updateRecordHive;updateRecordHive()}
function toggleWork(type){const i=selectedWorks.indexOf(type);if(i>=0)selectedWorks.splice(i,1);else selectedWorks.push(type);if(selectedWorks.some(x=>x!=="inspection")){if(!selectedWorks.includes("inspection"))selectedWorks.unshift("inspection")}else if(selectedWorks.length===0)selectedWorks=["inspection"];document.querySelectorAll(".work-choice button").forEach(b=>b.classList.toggle("selected",selectedWorks.includes(b.id.slice(3))));updateRecordHive()}
function updateRecordHive(){const h=data.hives.find(x=>x.id===document.getElementById("rh").value);if(!h)return;const ia=document.getElementById("inspectionArea");ia.innerHTML=`<div class="section-title">内検</div><label>群の状態</label><select id="rs"><option ${h.status==="強群"?"selected":""}>強群</option><option ${h.status==="普通"?"selected":""}>普通</option><option ${h.status==="弱群"?"selected":""}>弱群</option><option ${!h.status||h.status==="未設定"?"selected":""}>未設定</option></select><label>巣が出来ている段数（上から）</label><input id="rbuilt" type="number" min="0" max="20" value="${Number(h.builtTiers||0)}"><div class="hint">実段数は採蜜・次箱・撤去などの作業結果から自動で管理します。</div><label>給餌</label><div class="check-grid"><label class="check"><input id="feedWater" type="checkbox">水</label><label class="check"><input id="feedFood" type="checkbox">餌</label></div>`;updateWorkArea();updatePhotoFields()}
function updateWorkArea(){const area=document.getElementById("workArea"),h=data.hives.find(x=>x.id===document.getElementById("rh").value);if(!area||!h)return;const types=selectedWorks.filter(x=>x!=="inspection");let html="";if(types.includes("harvest")){html+=`<div class="card"><div class="section-title">採蜜</div><label>採蜜する重箱を図から選択</label><div class="box-stack" id="harvestBoxSelect">${selectStack(h,"harvest")}</div><label>採蜜するフローハイブを選択</label>${selectFlows(h,"harvest")}</div>`}if(types.includes("addbox")){html+=`<div class="card"><div class="section-title">次箱</div><label>追加する重箱の数</label><input id="addBoxes" type="number" min="0" max="10" value="0"><label>追加するフローハイブの基数</label><input id="addFlows" type="number" min="0" max="10" value="0"></div>`}if(types.includes("medicine")){html+=`<div class="card"><div class="section-title">薬設置</div><label>薬の名前</label><input id="medicineName"><label>量</label><input id="medicineAmount"><label>薬の設置場所</label><input id="medicinePlace"></div>`}if(types.includes("remove")){html+=`<div class="card"><div class="section-title">撤去</div><label>撤去する重箱を図から選択</label><div class="box-stack" id="removeBoxSelect">${selectStack(h,"remove")}</div><label>撤去するフローハイブを選択</label>${selectFlows(h,"remove")}</div>`}if(types.includes("move")){html+=`<div class="card"><div class="section-title">移動</div><label>移動時の群の大きさ（登録データ）</label><input value="${esc(h.status||"未設定")}" readonly><label>移動後の群の場所</label><input id="movePlace" value="${esc(h.place||"")}"></div>`}area.innerHTML=html}
function selectStack(h,mode){const real=Number(h.realTiers||0),built=Math.min(Number(h.builtTiers||0),real);return Array.from({length:real},(_,i)=>{const top=real-i;return `<div class="box-tier ${i<built?"built":""}" style="cursor:pointer" data-index="${top}" onclick="this.classList.toggle('selected')">${i<built?"巣あり":"空段"}・${top}段目 <span style="margin-left:auto">☐</span></div>`}).join("")}
function selectFlows(h,mode){return h.flowCount?`<div class="flow-row">${Array.from({length:h.flowCount},(_,i)=>`<label class="flow-item"><div class="flow-frame" data-level="${esc((h.flowLevels||[])[i]||"空")}" onclick="event.preventDefault();this.parentElement.querySelector('input').click()"><div class="honey"></div></div><div class="flow-label">基 ${i+1}</div><input class="${mode}-flow" type="checkbox" value="${i}"></label>`).join("")}</div>`:'<div class="hint">フローハイブはありません。</div>'}
function updatePhotoFields(){const a=document.getElementById("photoArea");if(!a)return;let groups=[];if(selectedWorks.includes("inspection"))groups.push(["内検",["下から","全体"]]);if(selectedWorks.includes("harvest"))groups.push(["採蜜",["作業前下から","作業前全体","作業後全体"]]);if(selectedWorks.includes("addbox"))groups.push(["次箱",["作業前下から","作業前全体","作業後全体"]]);if(selectedWorks.includes("medicine"))groups.push(["薬設置",["下から","全体","薬設置場所"]]);if(selectedWorks.includes("remove"))groups.push(["撤去",["作業前下から","作業前全体","作業後全体"]]);if(selectedWorks.includes("move"))groups.push(["移動",["作業前下から","作業前全体","作業後全体"]]);a.innerHTML=groups.map(([g,ls])=>`<div class="card"><div class="section-title">${g}の写真</div>${ls.map((l,i)=>`<label>${l}<input class="work-photo" data-group="${g}" data-label="${l}" type="file" accept="image/*" capture="environment"><img class="photo-preview hidden"></label>`).join("")}</div>`).join("");a.querySelectorAll(".work-photo").forEach(el=>el.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=el.parentElement.querySelector("img");img.src=rd.result;img.classList.remove("hidden")};rd.readAsDataURL(f)})}
function saveRecord(){const hive=data.hives.find(x=>x.id===document.getElementById("rh").value);if(!hive)return;const types=[...selectedWorks];let real=Number(hive.realTiers||0),built=Number(hive.builtTiers||0),flowCount=Number(hive.flowCount||0),flowLevels=[...(hive.flowLevels||[])],harvestBoxes=[],harvestFlows=[],addBoxes=0,addFlows=0,removeBoxes=[],removeFlows=[],medicineName="",medicineAmount="",medicinePlace="",movePlace="";if(types.includes("harvest")){harvestBoxes=[...document.querySelectorAll("#harvestBoxSelect .box-tier.selected")].map(e=>Number(e.dataset.index));harvestFlows=[...document.querySelectorAll(".harvest-flow:checked")].map(e=>Number(e.value));real=Math.max(0,real-harvestBoxes.length);built=Math.max(0,built-harvestBoxes.filter(i=>i>real).length);harvestFlows.forEach(i=>{if(i<flowLevels.length)flowLevels[i]="空"})}if(types.includes("addbox")){addBoxes=Math.max(0,Number(document.getElementById("addBoxes")?.value||0));addFlows=Math.max(0,Number(document.getElementById("addFlows")?.value||0));real+=addBoxes;flowCount+=addFlows;flowLevels.push(...Array(addFlows).fill("空"))}if(types.includes("remove")){removeBoxes=[...document.querySelectorAll("#removeBoxSelect .box-tier.selected")].map(e=>Number(e.dataset.index));removeFlows=[...document.querySelectorAll(".remove-flow:checked")].map(e=>Number(e.value));const removedTop=removeBoxes.filter(i=>i>real-built).length;real=Math.max(0,real-removeBoxes.length);built=Math.max(0,Math.min(real,built-removedTop));const rm=new Set(removeFlows);flowLevels=flowLevels.filter((_,i)=>!rm.has(i));flowCount=flowLevels.length}if(types.includes("medicine")){medicineName=document.getElementById("medicineName")?.value.trim()||"";medicineAmount=document.getElementById("medicineAmount")?.value.trim()||"";medicinePlace=document.getElementById("medicinePlace")?.value.trim()||""}if(types.includes("move")){movePlace=document.getElementById("movePlace")?.value.trim()||"";if(movePlace)hive.place=movePlace}if(types.includes("inspection")){hive.status=document.getElementById("rs")?.value||hive.status;built=Math.min(real,Math.max(0,Number(document.getElementById("rbuilt")?.value||built)))}hive.realTiers=real;hive.builtTiers=built;hive.flowCount=flowCount;hive.flowHive=flowCount>0;hive.flowLevels=flowLevels;const photos=[];let pending=document.querySelectorAll(".work-photo").length;if(!pending)finish();document.querySelectorAll(".work-photo").forEach((el,idx)=>{const f=el.files[0];if(!f){photos[idx]="";if(--pending===0)finish();return}const rd=new FileReader();rd.onload=()=>{photos[idx]=rd.result;if(--pending===0)finish()};rd.readAsDataURL(f)});function finish(){const photoMeta=[...document.querySelectorAll(".work-photo")].map((el,i)=>({group:el.dataset.group,label:el.dataset.label,data:photos[i]||""}));const feed=[document.getElementById("feedWater")?.checked?"水":"",document.getElementById("feedFood")?.checked?"餌":""].filter(Boolean).join("・");data.records.push({id:crypto.randomUUID(),hiveId:hive.id,date:document.getElementById("rd").value,weather:document.getElementById("rw").value,temp:document.getElementById("rt").value,workTypes:types,workType:types[0],status:hive.status,realTiers:real,builtTiers:built,flowHive:hive.flowHive,flowCount,flowLevels,harvestBoxes,harvestFlows,addBoxes,addFlows,removeBoxes,removeFlows,medicineName,medicineAmount,medicinePlace,moveGroupSize:hive.status,movePlace,feed,photos:photoMeta.filter(x=>x.data).map(x=>x.data),photoMeta,memo:document.getElementById("rm").value});save();render()}}
function calendar(m){const upcoming=data.tasks||[];m.innerHTML=`<h2>📅 予定</h2><div class="card"><label>作業内容</label><input id="tn" placeholder="例：巣箱01 内検"><label>日付</label><input id="td" type="date" value="${today()}"><button style="width:100%;margin-top:12px" onclick="addTask()">予定を追加</button></div><div class="section-title">予定一覧</div>${upcoming.sort((a,b)=>a.date.localeCompare(b.date)).map((t,i)=>`<div class="card" style="margin-bottom:8px"><b>${esc(t.date)}</b>　${esc(t.name)} <button class="secondary small" style="float:right;padding:6px 9px" onclick="delTask(${i})">削除</button></div>`).join("")||'<div class="card empty">予定はありません</div>'}`}
function addTask(){const n=document.getElementById("tn").value.trim(),d=document.getElementById("td").value;if(!n)return alert("作業内容を入力してください");data.tasks.push({name:n,date:d});save();render()}function delTask(i){data.tasks.splice(i,1);save();render()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;editingHive=null;selectedHive=null;render()});render();
</script>
</body>
