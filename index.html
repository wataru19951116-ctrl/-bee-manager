<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5b400">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>🐝 養蜂管理</title>
<style>
:root{--bg:#f6f6f2;--card:#fff;--ink:#202020;--muted:#777;--accent:#f3b52b;--line:#e6e3db;--wood:#94683e;--wax:#e9c978;--flow:#d6a23b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:84px}header{padding:18px 18px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:25px;margin:0}.date{font-size:14px;color:var(--muted);margin-top:4px}main{padding:14px}.section-title{font-size:20px;font-weight:800;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.stat b{display:block;font-size:28px;margin-top:2px}
button{border:0;border-radius:13px;padding:12px 14px;font-weight:800;font-size:15px;background:var(--accent);color:#222}button.secondary{background:#eee}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.hint{font-size:12px;color:var(--muted);margin-top:5px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}.nav button{background:transparent;border-radius:0;flex:1;max-width:220px;color:#777;padding:9px 4px 11px;font-size:12px}.nav button.active{color:#111}.nav span{display:block;font-size:21px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;background:#fff;font-size:16px}label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}
.back{margin-bottom:10px}.hidden{display:none!important}.danger{color:#c44}.badge{padding:6px 9px;border-radius:99px;background:#fff1c5;font-size:12px;font-weight:800}
.hive-card{margin-bottom:12px}.hive-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.hive-name{font-size:20px;font-weight:900}.hive-place{font-size:13px;color:var(--muted);margin-top:2px}
.hive-diagram{background:#faf7ee;border:1px solid #eee5d4;border-radius:15px;padding:10px;margin-top:10px}
.diagram{width:100%;max-width:210px;margin:auto}.flow-stack{display:flex;flex-direction:column;gap:4px;margin-bottom:5px}
.flow-unit{height:27px;border:2px solid #8e622f;border-radius:5px;background:#f2e1a8;position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px #dbc07a}
.flow-unit .fill{position:absolute;left:3px;bottom:3px;top:3px;width:var(--p);background:#e7b638;border-radius:2px;opacity:.9}.flow-unit .txt{position:relative;z-index:1;text-align:center;font-size:9px;line-height:23px;font-weight:800}
.box-stack{display:flex;flex-direction:column;gap:3px}.box-tier{height:28px;border:2px solid var(--wood);border-radius:4px;background:#eee9db;position:relative;overflow:hidden}.box-tier:after{content:"";position:absolute;inset:4px;background:repeating-linear-gradient(90deg,transparent 0 11px,#8d603b 11px 13px);opacity:.5}.box-tier.built{background:var(--wax)}.box-tier span{position:relative;z-index:1;display:block;text-align:center;font-size:9px;font-weight:800;line-height:24px}
.diagram-caption{text-align:center;color:#6f6557;font-size:10px;margin-top:6px}.flow-none{text-align:center;font-size:11px;color:#8a8174;padding:5px}
.home-hive-actions{display:flex;gap:8px;margin-top:10px}.home-hive-actions button{flex:1}
.record-card{background:#fff;border:1px solid #e5e0d6;border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.record-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}.record-title{font-weight:900;font-size:17px}.record-date{font-size:12px;color:#777}
.record-body{display:grid;grid-template-columns:1fr 155px;gap:10px;align-items:center}.record-meta{font-size:12px;line-height:1.7}.record-meta b{font-weight:800}
.record-diagram{background:#faf7ee;border-radius:13px;padding:7px}.record-diagram .diagram{max-width:145px}
.work-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.work-btn{background:#eee;text-align:left}.work-btn.selected{background:var(--accent)}
.photo-list{display:grid;gap:8px}.photo-box{border:1px dashed #ccc;border-radius:12px;padding:9px;background:#fafafa}.photo-box label{margin:0 0 5px}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid #ddd;border-radius:11px;padding:10px;background:#fff}.check input{width:auto;margin-right:6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
@media(max-width:390px){.record-body{grid-template-columns:1fr 125px}.record-diagram .diagram{max-width:120px}}
</style>
</head>
<body>
<div class="app">
<header><h1>🐝 養蜂管理</h1><div class="date" id="today"></div></header>
<main id="main"></main>
<nav class="nav">
<button data-tab="home" class="active">🏠<span>ホーム</span></button>
<button data-tab="records">📝<span>記録</span></button>
<button data-tab="calendar">📅<span>予定</span></button>
</nav>
</div>
<script>
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
const KEY="beeManagerV1";
let data=JSON.parse(localStorage.getItem(KEY)||'{"hives":[],"records":[],"tasks":[]}');
data.hives=(data.hives||[]).map(h=>({...h,realTiers:Number(h.realTiers||0),builtTiers:Number(h.builtTiers||0),flowHive:!!h.flowHive,flowCount:Number(h.flowCount||0),flowLevels:Array.isArray(h.flowLevels)?h.flowLevels:[]}));
data.records=(data.records||[]).map(r=>({...r,workType:r.workType||"inspection",workTypes:Array.isArray(r.workTypes)?r.workTypes:[r.workType||"inspection"],realTiers:Number(r.realTiers||0),builtTiers:Number(r.builtTiers||0),flowHive:!!r.flowHive,flowCount:Number(r.flowCount||0),flowLevels:Array.isArray(r.flowLevels)?r.flowLevels:[],photos:Array.isArray(r.photos)?r.photos:[]}));
let tab="home",editing=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const today=()=>new Date().toISOString().slice(0,10);
document.getElementById("today").textContent=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
const workNames={inspection:"内見",harvest:"採蜜",addbox:"次箱",medicine:"薬設置",remove:"撤去",move:"移動"};
const workClass=["inspection","harvest","addbox","medicine","remove","move"];

function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));const m=document.getElementById("main");if(tab==="home")home(m);else if(tab==="records")records(m);else calendar(m)}
function statusText(h){return h.status&&h.status!=="未設定"?h.status:"未設定"}
function pct(x){x=String(x||"");return x.includes("満")?100:x.includes("多")?75:x.includes("半")?50:x.includes("少")?25:0}
function hiveDiagram(real,built,flowCount,flowLevels,caption="作業後の状態"){
 real=Math.max(0,Number(real||0));built=Math.min(real,Math.max(0,Number(built||0)));flowCount=Math.max(0,Number(flowCount||0));flowLevels=Array.isArray(flowLevels)?flowLevels:[];
 let f=flowCount?Array.from({length:flowCount},(_,i)=>{let lv=flowLevels[i]||"空";return `<div class="flow-unit" style="--p:${pct(lv)}%"><div class="fill"></div><div class="txt">${i+1}基　${esc(lv)}</div></div>`}).join(""):`<div class="flow-none">フローハイブなし</div>`;
 let b=real?Array.from({length:real},(_,i)=>`<div class="box-tier ${i<built?"built":""}"><span>${i<built?"巣あり":"空段"}</span></div>`).reverse().join(""):`<div class="box-tier"><span>重箱未設定</span></div>`;
 return `<div class="diagram"><div class="flow-stack">${f}</div><div class="box-stack">${b}</div><div class="diagram-caption">${esc(caption)}</div></div>`;
}
function home(m){
 m.innerHTML=`<div class="grid"><div class="stat">🐝 巣箱<b>${data.hives.length}群</b></div><div class="stat">📝 記録<b>${data.records.length}件</b></div></div>
 <div class="section-title">巣箱</div>
 ${data.hives.length?data.hives.map(h=>homeHive(h)).join(""):'<div class="card empty">巣箱がありません。<br><button onclick="addHive()">＋ 巣箱を追加</button></div>'}
 <button style="width:100%;margin-top:4px" onclick="addHive()">＋ 巣箱を追加</button>`;
}
function homeHive(h){
 const last=data.records.filter(r=>r.hiveId===h.id).sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
 return `<div class="card hive-card"><div class="hive-top"><div><div class="hive-name">🐝 ${esc(h.name)}</div><div class="hive-place">${esc(h.place||"場所未設定")}</div></div><span class="badge">${esc(statusText(h))}</span></div>
 <div class="hive-diagram">${hiveDiagram(h.realTiers,h.builtTiers,h.flowCount,h.flowLevels,"現在の巣箱状態")}</div>
 <div class="small" style="margin-top:7px">最終作業：${last?esc(last.date):"まだ記録なし"}</div>
 <div class="home-hive-actions"><button onclick="newRecord('${h.id}')">＋ 作業登録</button><button class="secondary" onclick="editHive('${h.id}')">巣箱情報</button></div></div>`;
}
function records(m){
 const rs=[...data.records].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
 m.innerHTML=`<div class="row"><div><h2 style="margin:0">記録</h2><div class="muted">Bモデル風・作業後の巣箱状態を表示</div></div><button onclick="newRecord()">＋ 記録</button></div>
 <div style="margin-top:14px">${rs.length?rs.map(recordCard).join(""):'<div class="card empty">まだ記録がありません。</div>'}</div>`;
}
function recordCard(r){
 const h=data.hives.find(x=>x.id===r.hiveId)||{};
 const ws=(r.workTypes||[r.workType]).filter(Boolean);
 const label=ws.map(x=>workNames[x]||x).join("＋");
 const photos=r.photos||[];
 return `<div class="record-card"><div class="record-head"><div class="record-title">${esc(h.name||"削除済み")}</div><div class="record-date">${esc(r.date||"")}</div></div>
 <div class="badge" style="display:inline-block;margin-bottom:8px">${esc(label)}</div>
 <div class="record-body"><div class="record-meta">
 <div><b>群の状態：</b>${esc(r.status||h.status||"未設定")}</div>
 ${r.harvestBoxes?`<div><b>採蜜：</b>重箱 ${r.harvestBoxes}箱</div>`:""}
 ${r.harvestFlows?.length?`<div><b>採蜜：</b>フローハイブ ${r.harvestFlows.map(i=>`基${i+1}`).join("、")}</div>`:""}
 ${r.addBoxes?`<div><b>次箱：</b>重箱＋${r.addBoxes}箱</div>`:""}
 ${r.addFlows?`<div><b>次箱：</b>フローハイブ＋${r.addFlows}基</div>`:""}
 ${r.removeBoxes?`<div><b>撤去：</b>重箱 ${r.removeBoxes}箱</div>`:""}
 ${r.removeFlows?.length?`<div><b>撤去：</b>フローハイブ ${r.removeFlows.map(i=>`基${i+1}`).join("、")}</div>`:""}
 ${r.movePlace?`<div><b>移動先：</b>${esc(r.movePlace)}</div>`:""}
 ${r.medicineName?`<div><b>薬：</b>${esc(r.medicineName)} ${esc(r.medicineAmount||"")}</div>`:""}
 ${r.medicinePlace?`<div><b>薬設置場所：</b>${esc(r.medicinePlace)}</div>`:""}
 ${r.feedWater||r.feedFood?`<div><b>給餌：</b>${r.feedWater?"水 ":""}${r.feedFood?"餌":""}</div>`:""}
 ${r.memo?`<div><b>メモ：</b>${esc(r.memo)}</div>`:""}
 </div><div class="record-diagram">${hiveDiagram(r.realTiers,r.builtTiers,r.flowCount,r.flowLevels)}</div></div>
 ${photos.length?`<div class="hint" style="margin-top:8px">写真 ${photos.length}枚</div>`:""}</div>`;
}
function addHive(){editing="new";tab="home";hiveForm()}
function editHive(id){editing=id;hiveForm()}
function hiveForm(){
 const h=editing==="new"?{}:data.hives.find(x=>x.id===editing)||{};
 document.getElementById("main").innerHTML=`<button class="secondary back" onclick="editing=null;render()">← 戻る</button><h2>${editing==="new"?"巣箱を追加":"巣箱情報"}</h2>
 <label>巣箱名・番号</label><input id="hn" value="${esc(h.name||"")}" placeholder="例：わたる">
 <label>設置場所</label><input id="hp" value="${esc(h.place||"")}">
 <label>メモ</label><textarea id="hm" rows="4">${esc(h.memo||"")}</textarea>
 <button style="width:100%;margin-top:14px" onclick="saveHive()">保存</button>`;
}
function saveHive(){
 const name=document.getElementById("hn").value.trim();if(!name)return alert("巣箱名・番号を入力してください");
 const old=editing==="new"?{}:(data.hives.find(x=>x.id===editing)||{});
 const obj={...old,id:editing==="new"?crypto.randomUUID():editing,name,place:document.getElementById("hp").value,memo:document.getElementById("hm").value,status:old.status||"未設定",realTiers:Number(old.realTiers||0),builtTiers:Number(old.builtTiers||0),flowHive:!!old.flowHive,flowCount:Number(old.flowCount||0),flowLevels:Array.isArray(old.flowLevels)?old.flowLevels:[]};
 if(editing==="new")data.hives.push(obj);else data.hives[data.hives.findIndex(x=>x.id===editing)]=obj;save();editing=null;render();
}
function newRecord(hiveId){
 tab="records";const h=data.hives.find(x=>x.id===hiveId)||data.hives[0];
 if(!h){document.getElementById("main").innerHTML='<div class="card empty">先に巣箱を追加してください。<br><button onclick="addHive()">巣箱を追加</button></div>';return}
 document.getElementById("main").innerHTML=`<button class="secondary back" onclick="render()">← 戻る</button><h2>📝 作業を登録</h2>
 <label>巣箱</label><select id="rh">${data.hives.map(x=>`<option value="${x.id}" ${x.id===h.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
 <label>作業（複数選択可）</label><div class="work-grid">${workClass.map(x=>`<button class="work-btn" id="work-${x}" onclick="toggleWork('${x}')">${workNames[x]}</button>`).join("")}</div>
 <div class="hint">複数選択時は、選択した作業を1件の記録としてまとめます。</div>
 <label>日付</label><input id="rd" type="date" value="${today()}">
 <label>群の状態</label><select id="rs"><option>強群</option><option>普通</option><option>弱群</option><option selected>未設定</option></select>
 <div class="section-title">作業後の巣箱状態</div>
 <label>重箱の実段数</label><input id="rr" type="number" min="0" max="30" value="${Number(h.realTiers||0)}">
 <label>巣あり段数（上から）</label><input id="rb" type="number" min="0" max="30" value="${Number(h.builtTiers||0)}">
 <label>フローハイブ基数</label><input id="rf" type="number" min="0" max="20" value="${Number(h.flowCount||0)}">
 <div id="flowState"></div><div id="workArea"></div>
 <div class="section-title">給餌</div><label class="check"><input id="feedWater" type="checkbox"> 水</label><label class="check"><input id="feedFood" type="checkbox"> 餌</label>
 <div class="section-title">写真</div><div id="photos" class="photo-list"></div>
 <label>メモ</label><textarea id="rm" rows="4"></textarea>
 <button style="width:100%;margin-top:14px" onclick="saveRecord()">記録する</button>`;
 document.querySelectorAll(".work-btn")[0].click();document.getElementById("rh").onchange=updateForm;["rr","rb","rf"].forEach(id=>document.getElementById(id).oninput=updateForm);updateForm();
}
let selectedWorks=new Set(["inspection"]);
function toggleWork(x){if(selectedWorks.has(x))selectedWorks.delete(x);else selectedWorks.add(x);if(!selectedWorks.size)selectedWorks.add(x);document.querySelectorAll(".work-btn").forEach(b=>b.classList.toggle("selected",selectedWorks.has(b.id.replace("work-",""))));updateForm()}
function updateForm(){
 const h=data.hives.find(x=>x.id===document.getElementById("rh").value)||{};
 const n=Math.max(0,Number(document.getElementById("rf").value||0));
 let levels=h.flowLevels||[];document.getElementById("flowState").innerHTML=n?`<label>フローハイブ貯蜜状況（作業後）</label><div class="work-grid">${Array.from({length:n},(_,i)=>`<button class="work-btn selected" id="fl-${i}" data-lv="${esc(levels[i]||"空")}" onclick="cycleFormFlow(${i})">基${i+1}：${esc(levels[i]||"空")}</button>`).join("")}</div>`:"";
 const ws=[...selectedWorks];let a="";
 if(ws.includes("harvest"))a+=`<div class="section-title">採蜜</div><label>採蜜する重箱</label><input id="harvestBoxes" type="number" min="0" value="0"><label>採蜜するフローハイブ</label><div class="check-grid">${Array.from({length:h.flowCount||0},(_,i)=>`<label class="check"><input class="harvestFlow" type="checkbox" value="${i}">基${i+1}</label>`).join("")}</div>`;
 if(ws.includes("addbox"))a+=`<div class="section-title">次箱</div><label>追加する重箱</label><input id="addBoxes" type="number" min="0" value="0"><label>追加するフローハイブ</label><input id="addFlows" type="number" min="0" value="0">`;
 if(ws.includes("medicine"))a+=`<div class="section-title">薬設置</div><label>薬</label><input id="medicineName" placeholder="薬の名前"><label>量</label><input id="medicineAmount" placeholder="例：5g"><label>薬の設置場所</label><input id="medicinePlace" placeholder="例：上蓋の下">`;
 if(ws.includes("remove"))a+=`<div class="section-title">撤去</div><label>撤去する重箱</label><div class="check-grid">${Array.from({length:Number(document.getElementById("rr").value||0)},(_,i)=>`<label class="check"><input class="removeBox" type="checkbox" value="${i}">上から${i+1}段目</label>`).join("")}</div><label>撤去するフローハイブ</label><div class="check-grid">${Array.from({length:h.flowCount||0},(_,i)=>`<label class="check"><input class="removeFlow" type="checkbox" value="${i}">基${i+1}</label>`).join("")}</div>`;
 if(ws.includes("move"))a+=`<div class="section-title">移動</div><label>移動後の群の場所</label><input id="movePlace" placeholder="例：○○畑"><div class="hint">群の大きさは登録されている現在のデータから自動で引き継ぎます。</div>`;
 document.getElementById("workArea").innerHTML=a;updatePhotos();
}
function cycleFormFlow(i){const b=document.getElementById("fl-"+i),seq=["空","少ない","半分","多い","満杯"];const x=b.dataset.lv||"空";b.dataset.lv=seq[(seq.indexOf(x)+1)%seq.length];b.textContent=`基${i+1}：${b.dataset.lv}`}
function updatePhotos(){
 const ws=[...selectedWorks],multi=ws.length>1;let items=[];
 if(!multi&&ws.includes("inspection"))items.push(["作業前下から","before_bottom"],["作業前全体","before_all"]);
 else if(ws.some(x=>["harvest","addbox","remove","move"].includes(x)))items.push(["作業前下から","before_bottom"],["作業前全体","before_all"],["作業後全体","after_all"]);
 if(ws.includes("medicine"))items.push(["薬設置場所","medicine_place"]);
 if(!items.length)items.push(["写真","photo"]);
 document.getElementById("photos").innerHTML=items.map(([t,k])=>`<div class="photo-box"><label>${t}</label><input class="photo-input" data-key="${k}" type="file" accept="image/*" capture="environment"></div>`).join("");
}
function readPhotos(done){
 const files=[...document.querySelectorAll(".photo-input")],out=[];let left=files.length;if(!left)return done([]);
 files.forEach(f=>{if(!f.files[0]){if(!--left)done(out);return}const rd=new FileReader();rd.onload=()=>{out.push({key:f.dataset.key,src:rd.result});if(!--left)done(out)};rd.readAsDataURL(f.files[0])});
}
function saveRecord(){
 readPhotos(photos=>{
  const h=data.hives.find(x=>x.id===document.getElementById("rh").value);if(!h)return;
  const ws=[...selectedWorks],real0=Math.max(0,Number(document.getElementById("rr").value||0)),built0=Math.min(real0,Math.max(0,Number(document.getElementById("rb").value||0)));
  let real=real0,built=built0,flowCount=Math.max(0,Number(document.getElementById("rf").value||0));
  let flowLevels=Array.from({length:flowCount},(_,i)=>document.getElementById("fl-"+i)?.dataset.lv||h.flowLevels?.[i]||"空");
  const harvestBoxes=Math.min(real,Math.max(0,Number(document.getElementById("harvestBoxes")?.value||0)));
  const harvestFlows=[...document.querySelectorAll(".harvestFlow:checked")].map(x=>Number(x.value));
  const addBoxes=Math.max(0,Number(document.getElementById("addBoxes")?.value||0)),addFlows=Math.max(0,Number(document.getElementById("addFlows")?.value||0));
  const removeBoxes=[...document.querySelectorAll(".removeBox:checked")].map(x=>Number(x.value));
  const removeFlows=[...document.querySelectorAll(".removeFlow:checked")].map(x=>Number(x.value));
  if(ws.includes("harvest")){real=Math.max(0,real-harvestBoxes);built=Math.min(built,real);harvestFlows.forEach(i=>{if(i<flowLevels.length)flowLevels[i]="空"})}
  if(ws.includes("addbox")){real+=addBoxes;flowCount+=addFlows;for(let i=0;i<addFlows;i++)flowLevels.push("空")}
  if(ws.includes("remove")){const cnt=removeBoxes.length;real=Math.max(0,real-cnt);built=Math.min(built,real);const kept=flowLevels.filter((_,i)=>!removeFlows.includes(i));flowLevels=kept;flowCount=kept.length}
  const medName=document.getElementById("medicineName")?.value||"",medAmt=document.getElementById("medicineAmount")?.value||"",medPlace=document.getElementById("medicinePlace")?.value||"",movePlace=document.getElementById("movePlace")?.value||"";
  h.status=document.getElementById("rs").value;h.realTiers=real;h.builtTiers=built;h.flowHive=flowCount>0;h.flowCount=flowCount;h.flowLevels=flowLevels;if(movePlace)h.place=movePlace;
  data.records.push({id:crypto.randomUUID(),hiveId:h.id,date:document.getElementById("rd").value,workType:ws[0],workTypes:ws,realTiers:real,builtTiers:built,flowHive:h.flowHive,flowCount,flowLevels,harvestBoxes,harvestFlows,addBoxes,addFlows,removeBoxes:removeBoxes.length,removeFlows,medicineName:medName,medicineAmount:medAmt,medicinePlace:medPlace,movePlace,feedWater:document.getElementById("feedWater").checked,feedFood:document.getElementById("feedFood").checked,photos,memo:document.getElementById("rm").value});
  save();selectedWorks=new Set(["inspection"]);render();
 });
}
function calendar(m){const ts=data.tasks||[];m.innerHTML=`<h2>📅 予定</h2><div class="card"><label>作業内容</label><input id="tn" placeholder="例：巣箱01 内検"><label>日付</label><input id="td" type="date" value="${today()}"><button style="width:100%;margin-top:12px" onclick="addTask()">予定を追加</button></div><div class="section-title">予定一覧</div>${ts.sort((a,b)=>a.date.localeCompare(b.date)).map((t,i)=>`<div class="card" style="margin-bottom:8px"><b>${esc(t.date)}</b>　${esc(t.name)}</div>`).join("")||'<div class="card empty">予定はありません</div>'}`}
function addTask(){const n=document.getElementById("tn").value.trim(),d=document.getElementById("td").value;if(!n)return;data.tasks.push({name:n,date:d});save();render()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
render();
</script>
