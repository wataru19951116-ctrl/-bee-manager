<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5b400">
<meta name="bee-manager-version" content="V55">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Beeレコード</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--ink:#222;--muted:#777;--accent:#f5b400;--line:#e8e8e3;--danger:#d9534f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:84px}header{padding:18px 18px 10px;background:var(--card);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0}.date{font-size:13px;color:var(--muted);margin-top:4px}main{padding:16px}.section-title{font-weight:700;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{font-size:22px;display:block;margin-top:4px}
.muted{color:var(--muted);font-size:13px}button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;background:var(--accent);color:#222}button.secondary{background:#eee}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}
.nav button{background:transparent;border-radius:0;flex:1;max-width:180px;font-size:12px;color:#666;padding:10px 4px 12px}.nav button.active{color:#111}.nav span{display:block;font-size:21px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;background:#fff;font-size:16px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.hive{margin-bottom:10px}.hive-head{display:flex;justify-content:space-between;align-items:center}.badge{padding:5px 8px;border-radius:99px;background:#fff3c7;font-size:12px}
.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.hidden{display:none!important}.back{margin-bottom:12px}.photo-preview{max-width:100%;border-radius:12px;margin-top:8px}
.small{font-size:12px}.danger{color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:30px 10px}.hint{font-size:12px;color:var(--muted);margin-top:6px}
.flow-wrap{margin-top:12px}.flow-title{font-weight:700;margin-bottom:8px}.flow-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.flow-item{min-width:42px;text-align:center}.flow-frame{width:42px;height:38px;margin:auto;border:2px solid #9b6b32;border-radius:8px;background:#f5f0df;position:relative;padding:3px;box-shadow:inset 0 0 0 1px #d5b57c}
.flow-frame:before,.flow-frame:after{content:"";position:absolute;left:7px;right:7px;height:1px;background:#c9a86f}.flow-frame:before{top:12px}.flow-frame:after{top:24px}
.flow-frame .honey{position:absolute;left:6px;right:6px;bottom:5px;height:0;border-radius:5px;background:#f5b400;opacity:.85}
.flow-frame[data-level="少ない"] .honey{height:18%}.flow-frame[data-level="半分"] .honey{height:43%}.flow-frame[data-level="多い"] .honey{height:68%}.flow-frame[data-level="満杯"] .honey{height:88%}
.flow-label{font-size:12px;font-weight:700;margin-top:4px}.flow-level{font-size:11px;color:var(--muted);margin-top:2px}
.box-stack{display:flex;flex-direction:column;gap:4px;margin-top:10px}.box-tier{height:38px;border:2px solid #9b6b32;border-radius:6px;background:#eee8d6;display:flex;align-items:center;justify-content:center;font-size:12px}.box-tier.built{background:#f5d36b;font-weight:700}
.work-register-section-title{font-size:15px;font-weight:800;margin:12px 0 7px;padding:0}.work-choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.work-choice button{background:#eee}.work-choice button.selected{background:var(--accent)}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid #ddd;border-radius:10px;padding:10px;background:#fff}.check input{width:auto;margin-right:6px}
.move-location{margin-top:4px;line-height:1.45;text-align:left}</style>

<style id="record-b-model-v3">
.record-b-card{background:#fff;border:1px solid #e5e3dc;border-radius:16px;margin-bottom:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.045)}
.record-b-layout{display:grid;grid-template-columns:76px minmax(0,1fr) 122px;gap:12px;align-items:stretch}
.record-b-year{font-size:10px;font-weight:700;line-height:1.2;margin-top:3px}
.record-b-monthday{font-size:13px;font-weight:800;line-height:1.2;margin-top:2px}
.record-b-weather{font-size:10px;line-height:1.2;margin-top:6px}
.record-b-temp{font-size:10px;font-weight:700;line-height:1.2;margin-top:2px}
.record-b-left{border-right:1px solid #ece9e1;padding:10px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;border-radius:10px;min-height:100%;box-sizing:border-box}
.record-b-left.record-color-inspection{background:#fff1bd}.record-b-left.record-color-harvest{background:#dcecff}.record-b-left.record-color-addbox{background:#e2f6d7}.record-b-left.record-color-medicine{background:#f2e4ff}.record-b-left.record-color-remove{background:#ffe0df}.record-b-left.record-color-move{background:#e0f4f2}
.record-b-type{width:100%;padding:8px 5px;border-radius:12px;font-size:12px;font-weight:800}
.record-b-date{font-size:10px;line-height:1.45;color:#555;margin-top:8px;word-break:keep-all}
.record-b-center{min-width:0;display:flex;flex-direction:column;justify-content:center}
.record-b-hive-name{font-size:11px;color:#777;margin-bottom:3px}
.record-b-title{font-size:16px;font-weight:800;margin-bottom:5px}
.record-b-info{font-size:11px;line-height:1.65}
.record-b-section{font-size:10px;font-weight:800;color:#777;margin-top:5px;margin-bottom:2px}.record-b-value{font-size:13px;font-weight:700;line-height:1.45}.record-b-work{font-size:11px;line-height:1.65}.record-photo-button{margin-top:7px;width:100%;padding:7px 8px;border:1px solid #ddd;border-radius:9px;background:#fff;font-size:11px;font-weight:800;color:#333}.record-photo-button:active{transform:scale(.98)}.record-photo-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}.record-photo-panel{width:min(92vw,520px);max-height:88vh;background:#fff;border-radius:16px;padding:12px;overflow:auto}.record-photo-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.record-photo-close{width:auto;padding:7px 11px;border-radius:9px;background:#eee;color:#333}.record-photo-list{display:flex;flex-direction:column;gap:10px}.record-photo-list img{width:100%;height:auto;border-radius:10px;display:block}
.record-b-info b{font-weight:800}
.record-b-right{background:#faf8f2;border-radius:11px;padding:6px 5px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.record-hive-figure{background:transparent;text-align:center}
.record-flow-title{font-size:7px;font-weight:800;color:#333;margin:0 0 3px}
.record-flow-stack{display:flex;justify-content:center;gap:4px;margin-bottom:6px}
.record-flow-item{width:25px;flex:0 0 25px}
.record-flow-frame{height:34px;border:1.7px solid #936b32;border-radius:4px;background:#f5f0df;position:relative;overflow:hidden}
.record-flow-frame:before,.record-flow-frame:after{content:"";position:absolute;left:3px;right:3px;height:1px;background:#c9a86f;z-index:2}
.record-flow-frame:before{top:10px}.record-flow-frame:after{top:20px}
.record-honey{position:absolute;left:3px;right:3px;bottom:2px;height:0;background:#f5b400;border-radius:3px;opacity:.9}
.record-flow-frame[data-level="少ない"] .record-honey{height:18%}
.record-flow-frame[data-level="半分"] .record-honey{height:43%}
.record-flow-frame[data-level="多い"] .record-honey{height:68%}
.record-flow-frame[data-level="満杯"] .record-honey{height:88%}
.record-flow-frame span{position:absolute;bottom:0;left:0;right:0;font-size:6px;line-height:9px;font-weight:800;z-index:3}
.record-flow-level{font-size:6px;color:#777;white-space:nowrap;overflow:hidden}
.harvest-flow-picker .flow-item{cursor:pointer}.harvest-flow-picker .flow-frame.selected{outline:3px solid #f5b400;background:#ffe9a3}
.record-box-title{font-size:7px;font-weight:800;color:#333;margin:0 0 3px}
.record-box-stack{display:flex;flex-direction:column;gap:2px;margin:0 4px}
.record-box-tier{height:17px;border:1.4px solid #936b45;border-radius:3px;background:#eee;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box}
.record-box-tier.built,.record-box-tier.empty{height:17px}
.record-box-tier.built{background:#f5d36b}
.record-box-tier span{font-size:7px;line-height:1;display:flex;align-items:center;justify-content:center;width:100%;height:100%;text-align:center;color:#684b2d;font-weight:800}
.record-hive-caption{font-size:7px;color:#777;margin-top:4px}
.record-photos{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.record-photos .photo-preview{width:72px;height:54px;object-fit:cover;margin-top:0;flex:0 0 auto}
.record-color-inspection{background:#fff1bd;color:#795b16}
.record-color-harvest{background:#dcecff;color:#2462a3}
.record-color-addbox{background:#e2f6d7;color:#2c7a25}
.record-color-medicine{background:#f2e4ff;color:#7142a5}
.record-color-remove{background:#ffe0df;color:#a33a35}
.record-color-move{background:#e0f4f2;color:#23736e}
@media(max-width:380px){.record-b-layout{grid-template-columns:64px minmax(0,1fr) 106px;gap:8px}.record-b-title{font-size:14px}.record-b-info{font-size:10px}.record-b-date{font-size:9px}.record-flow-item{width:22px}.record-flow-frame{height:31px}.record-box-stack{margin:0 3px}.record-box-tier,.record-box-tier.built,.record-box-tier.empty{height:16px}.record-box-tier span{line-height:1}}
</style>


<style id="record-swipe-delete">
.record-swipe{position:relative;overflow:hidden;border-radius:16px;margin-bottom:12px;background:#e85b55}
.record-swipe .record-b-card{position:relative;z-index:2;margin-bottom:0;transition:transform .22s ease;touch-action:pan-y}
.record-delete{position:absolute;z-index:1;right:0;top:0;bottom:0;width:78px;border:0;border-radius:0;background:#e85b55;color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.record-swipe.open .record-b-card{transform:translateX(-78px)}
.harvest-box-picker .box-tier{cursor:pointer}
</style>

<style id="v47-schedule-only">
.schedule-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.schedule-head h2{margin:0}.schedule-sub{font-size:12px;color:var(--muted);margin-top:3px}.schedule-add{padding:10px 14px}.week-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:18px}.week-month{text-align:center;font-weight:800;margin-bottom:10px}.week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.week-day{font-size:10px;color:#777}.week-date{height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;position:relative}.week-date.today{background:var(--accent);font-weight:800}.week-date.has-task:after{content:"";width:5px;height:5px;border-radius:50%;background:#9b6b32;position:absolute;bottom:1px}.schedule-section{display:flex;align-items:center;justify-content:space-between;margin:17px 2px 8px}.schedule-section b{font-size:16px}.count-pill{font-size:11px;background:#eee;padding:5px 9px;border-radius:99px}.task-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:9px;display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;align-items:center}.task-time{text-align:center;font-size:12px;font-weight:800}.task-main{min-width:0}.task-title{font-weight:800;font-size:15px}.task-meta{font-size:12px;color:#666;margin-top:3px}.task-memo{font-size:11px;color:#777;margin-top:3px}.task-actions{grid-column:1/-1;display:flex;gap:7px}.task-actions button{flex:1;padding:9px;font-size:12px}.task-record{background:var(--accent);color:#222}.task-done{opacity:.58}.schedule-form-title{margin:0 0 12px}.schedule-form .card{margin-bottom:10px}.schedule-work-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.schedule-work-grid button{background:#eee;padding:12px 8px;font-size:13px}.schedule-work-grid button.selected{background:var(--accent)}.schedule-save{width:100%;margin-top:12px}.schedule-empty{text-align:center;padding:22px;color:#777}.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.month-nav button{background:#eee;padding:7px 11px;font-size:13px}.month-title{font-weight:800}.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.month-cell{height:38px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:10px;font-size:13px}.month-cell.blank{visibility:hidden}.month-cell.today{background:var(--accent);font-weight:800}.month-cell.has-task:after{content:"";width:5px;height:5px;border-radius:50%;background:#9b6b32;position:absolute;bottom:3px}.month-cell{cursor:pointer}.month-cell.selected{outline:2px solid #9b6b32;outline-offset:-2px}.selected-day-head{display:flex;align-items:center;justify-content:space-between;margin:17px 2px 8px}.selected-day-head b{font-size:16px}.calendar-marks{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:3px;height:6px}.calendar-dot{width:5px;height:5px;border-radius:50%}.calendar-dot.task{background:#f5b400;border:1px solid #9b6b32}.calendar-dot.record{background:#5b9bd5}.calendar-legend{display:flex;justify-content:center;gap:16px;margin-top:9px;font-size:10px;color:#666}.calendar-legend span{display:flex;align-items:center;gap:5px}.calendar-legend i{display:inline-block;width:7px;height:7px;border-radius:50%}.calendar-legend .task{background:#f5b400;border:1px solid #9b6b32}.calendar-legend .record{background:#5b9bd5}.day-record-card{background:#fff;border:1px solid var(--line);border-left:5px solid #5b9bd5;border-radius:14px;padding:11px 12px;margin-bottom:8px}.day-record-title{font-weight:800;font-size:14px}.day-record-meta{font-size:12px;color:#666;margin-top:3px}.day-record-memo{font-size:11px;color:#777;margin-top:5px;white-space:pre-wrap}.selected-day-subhead{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 7px}.selected-day-subhead b{font-size:13px}
</style>

function hives(m){if(editingHive!==null){hiveForm(m);return}const hs=activeHives();m.innerHTML=`<div class="row"><div><h2 style="margin:0">巣箱</h2><div class="muted">巣箱の状況は作業登録から更新します</div></div><button onclick="addHive()">＋ 追加</button></div><div style="margin-top:14px">${hs.length?hs.map(hiveCard).join(""):'<div class="card empty">まだ巣箱がありません。<br>「＋ 追加」から登録できます。</div>'}</div>`}
function stackHtml(real,built){return Array.from({length:real},(_,i)=>`<div class="box-tier ${i<built?"built":""}">${i<built?"巣あり":"空段"}・${i+1}段目</div>`).join("")}
function removeStackHtml(real,built){return Array.from({length:real},(_,i)=>`<div class="box-tier ${i<built?"built":""}" data-tier="${i+1}">${i<built?"巣あり":"空段"}・${i+1}段目</div>`).join("")}
function harvestStackHtml(real,built,selected){
 return Array.from({length:built},(_,i)=>{
  const tier=i+1,chosen=selected.includes(tier);
  return `<div class="box-tier built${chosen?" selected":""}" data-tier="${tier}">${tier}段目</div>`;
 }).join("");
}
function flowHtml(h,onclickMode=true){return h.flowHive?`<div class="flow-wrap"><div class="flow-title">🍯 フローハイブ ${h.flowCount}基</div><div class="flow-row">${Array.from({length:h.flowCount},(_,i)=>flowMini(h,i,onclickMode)).join("")}</div></div>`:'<div class="hint" style="margin-top:10px">フローハイブ：なし</div>'}

function cycleFlow(id,i){const h=data.hives.find(x=>x.id===id);if(!h)return;const seq=["空","少ない","半分","多い","満杯"];h.flowLevels=h.flowLevels||[];h.flowLevels[i]=seq[(seq.indexOf(h.flowLevels[i]||"空")+1)%seq.length];save();render()}
function hiveForm(m){const isNew=editingHive==="new";const h=isNew?{}:data.hives.find(x=>x.id===editingHive)||{};m.innerHTML=`<button class="secondary back" onclick="editingHive=null;render()">← 戻る</button><h2>${isNew?"巣箱を追加":"巣箱情報を編集"}</h2>${isNew?'<div class="hint">新しい巣箱は、登録時に現在の状況も入力できます。登録後の状況変更は作業登録から行います。</div>':'<div class="hint">段数・巣あり・フローハイブ・群の状態は、ここでは変更できません。作業登録の内検・作業結果から更新します。</div>'}<label>巣箱名・番号</label><input id="hn" value="${esc(h.name||"")}" placeholder="例：巣箱01"><label>設置場所</label><input id="hp" value="${esc(h.place||"")}" placeholder="例：○○畑">${isNew?`<div class="section-title">初期の巣箱状況</div><label>群の状態</label><select id="hs"><option value="未設定">未設定</option><option value="強群">強群</option><option value="普通">普通</option><option value="弱群">弱群</option></select><label>重箱の実段数</label><input id="hreal" type="number" min="0" max="20" value="0"><label>巣が出来ている段数（上から）</label><input id="hbuilt" type="number" min="0" max="20" value="0"><div class="hint">「巣あり」は重箱の上から数えます。</div><label>フローハイブ</label><select id="hflow"><option value="false">なし</option><option value="true">あり</option></select><label>フローハイブ設置基数</label><input id="hfc" type="number" min="0" max="10" value="0"><div id="newFlowArea"></div>`:''}<label>メモ</label><textarea id="hm" rows="4">${esc(h.memo||"")}</textarea><button style="width:100%;margin-top:14px" onclick="saveHive()">保存</button>${!isNew?`<button style="width:100%;margin-top:10px;background:#e85b55;color:#fff" onclick="discardHive('${h.id}')">群を破棄</button>`:""}`;if(isNew){hflow.onchange=updateNewFlow;hfc.oninput=updateNewFlow;updateNewFlow()}}function updateNewFlow(){const a=document.getElementById("newFlowArea"),on=hflow.value==="true",n=on?Math.max(0,Number(hfc.value||0)):0;a.innerHTML=on?`<label>各フローハイブの初期貯蜜状況</label><div class="flow-row">${Array.from({length:n},(_,i)=>`<div class="flow-item"><div class="flow-frame" id="nf${i}" data-level="空" onclick="cycleNewFlow(${i})"><div class="honey"></div></div><div class="flow-label">基 ${i+1}</div><div class="flow-level" id="nfl${i}">空</div></div>`).join("")}</div><div class="hint">各基をタップして「空 → 少ない → 半分 → 多い → 満杯」と変更できます。</div>`:""}function cycleNewFlow(i){const e=document.getElementById("nf"+i),l=document.getElementById("nfl"+i),s=["空","少ない","半分","多い","満杯"];const n=s[(s.indexOf(e.dataset.level)+1)%s.length];e.dataset.level=n;l.textContent=n;e.dataset.level=n;e.setAttribute("data-level",n)}function addHive(){editingHive="new";currentTab="hives";render()}
function editHive(id){editingHive=id;render()}
function discardHive(id){
 const h=data.hives.find(x=>x.id===id);if(!h)return;
 if(!confirm(`「${h.name}」を破棄しますか？\n\nホームの管理対象から外れます。過去の作業記録は残ります。`))return;
 h.discarded=true;h.discardedAt=Date.now();save();editingHive=null;selectedHive=null;render();

function workLabel(t){
 const labels={inspection:"内見",harvest:"採蜜",addbox:"次箱",medicine:"薬設置",remove:"撤去",move:"移動"};
 return labels[t]||"作業";
}
function recordHiveFigure(r){
 const real=Math.max(0,Number(r.realTiers||0));
 const built=Math.min(real,Math.max(0,Number(r.builtTiers||0)));
 const flowCount=Math.max(0,Number(r.flowCount||0));
 const levels=Array.isArray(r.flowLevels)?r.flowLevels:[];
 const flow=flowCount?`<div class="record-flow-title">フローハイブ（貯蜜量）</div><div class="record-flow-stack">${Array.from({length:flowCount},(_,i)=>{
   const lv=levels[i]||"空";
   return `<div class="record-flow-item"><div class="record-flow-frame" data-level="${esc(lv)}"><div class="record-honey"></div><span>基${i+1}</span></div><div class="record-flow-level">${esc(lv)}</div></div>`;
 }).join("")}</div>`:"";
 const boxes=real?Array.from({length:real},(_,i)=>`<div class="record-box-tier ${i<built?"built":"empty"}"><span>${i<built?"巣あり":"空"}</span></div>`).join(""):'<div class="record-box-tier empty"><span>未設定</span></div>';
 return `<div class="record-hive-figure">${flow}<div class="record-box-title">重箱（巣の状態）</div><div class="record-box-stack">${boxes}</div><div class="record-hive-caption">作業後の巣箱</div></div>`;
}
function openRecordPhotos(id){
 const r=data.records.find(x=>x.id===id);if(!r)return;
 const photos=(r.photos||[]).filter(Boolean);if(!photos.length&&r.photo)photos.push(r.photo);if(!photos.length)return;
 const old=document.getElementById("recordPhotoModal");if(old)old.remove();
 const modal=document.createElement("div");modal.id="recordPhotoModal";modal.className="record-photo-modal";
 modal.innerHTML=`<div class="record-photo-panel" onclick="event.stopPropagation()">
   <div class="record-photo-head"><b>📷 写真</b><button class="record-photo-close" type="button" onclick="closeRecordPhotos()">閉じる</button></div>
   <div class="record-photo-list">${photos.map(p=>`<img src="${esc(p)}" alt="作業写真">`).join("")}</div>
 </div>`;
 modal.addEventListener("click",closeRecordPhotos);document.body.appendChild(modal);
}
function closeRecordPhotos(){const m=document.getElementById("recordPhotoModal");if(m)m.remove();}
function latestRecordId(){const rs=(data.records||[]).map((r,i)=>({r,i})).sort((a,b)=>(Number(b.r.createdAt||0)-Number(a.r.createdAt||0))||(b.i-a.i));return rs[0]?.r?.id||null}
function recordCard(r){
 const canDelete=currentTab==="records" && r.id===latestRecordId();
 const h=data.hives.find(x=>x.id===r.hiveId);
 const labels={inspection:"内見",harvest:"採蜜",addbox:"次箱",medicine:"薬設置",remove:"撤去",move:"移動"};
 const cls={inspection:"record-color-inspection",harvest:"record-color-harvest",addbox:"record-color-addbox",medicine:"record-color-medicine",remove:"record-color-remove",move:"record-color-move"};
 const details=[];

 if(r.harvestBoxTiers?.length || r.harvestBoxes || r.harvestFlows?.length){
   const hb=r.harvestBoxes||r.harvestBoxTiers?.length||0;
   const hf=r.harvestFlows||[];
   details.push(`<div><b>採蜜</b><div style="margin-left:0.5em">重箱　　${hb}箱${hf.length?`<br>ハイブ　${hf.length}基`:""}</div></div>`);
 }

 const feedText=r.inspectionFeed||r.feed;
 if(feedText)details.push(`<div><b>給餌</b>　${esc(feedText)}</div>`);

 if(r.addBoxes||r.addFlows){
   details.push(`<div><b>次箱</b><div style="margin-left:0.5em">${r.addBoxes?`重箱　　${r.addBoxes}段`:""}${r.addFlows?`${r.addBoxes?`<br>`:``}ハイブ　${r.addFlows}基`:``}</div></div>`);
 }

 if(r.medicineName || r.medicineAmount || r.medicinePlace){
   details.push(`<div><b>薬設置</b><div style="margin-left:0.5em">薬名　${esc(r.medicineName||"")}<br>量　　${esc(r.medicineAmount||"")}<br>場所　${esc(r.medicinePlace||"")}</div></div>`);
 }

 if(r.removeBoxTiers?.length || r.removeBoxes || r.removeFlows?.length){
   const rb=r.removeBoxes||r.removeBoxTiers?.length||0;
   const rf=r.removeFlows||[];
   details.push(`<div><b>撤去</b><div style="margin-left:0.5em">${rb?`重箱　${rb}段`:""}${rf.length?`${rb?"<br>":""}ハイブ　${rf.length}基`:""}</div></div>`);
 }

 if(r.movePlace)details.push(`<div><b>移動</b><div class="move-location">${esc(r.moveFromPlace||"未設定")}<br>↓<br>${esc(r.movePlace)}</div></div>`);

 const photos=(r.photos||[]).filter(Boolean);if(!photos.length&&r.photo)photos.push(r.photo);
 const figure=recordHiveFigure(r);
 const status=esc(r.status||h?.status||"未設定");

 return `<div class="${canDelete?"record-swipe":"record-static"}" data-record-id="${esc(r.id||"")}">
  ${canDelete?`<button class="record-delete" type="button" onclick="deleteRecord('${esc(r.id||"")}')">削除</button>`:""}
  <div class="record-b-card">
   <div class="record-b-layout">
    <div class="record-b-left ${cls[r.workType]||"record-color-inspection"}">
     <div class="record-b-type">${labels[r.workType]||"作業"}</div>
     <div class="record-b-year">${esc((r.date||"").slice(0,4))}年</div>
     <div class="record-b-monthday">${esc((r.date||"").slice(5).replace(/-/g,"/"))}</div>
     <div class="record-b-weather">${esc(r.weather||"")}</div>
     <div class="record-b-temp">${r.temp!=null&&r.temp!==""?esc(r.temp)+"℃":""}</div>
    </div>
    <div class="record-b-center">
     <div class="record-b-section">群の名前</div>
     <div class="record-b-value">${esc(h?.name||"削除済み")}</div>
     <div class="record-b-section">群の状況</div>
     <div class="record-b-value">${status}</div>
     <div class="record-b-section">作業の内容</div>
     <div class="record-b-work">${details.join("")||'<div class="muted">記録内容なし</div>'}${r.memo?`<div style="margin-top:7px"><b>メモ</b><div>${esc(r.memo)}</div></div>`:""}</div>
     ${photos.length?`<button class="record-photo-button" type="button" onclick="openRecordPhotos('${esc(r.id||"")}')">📷 写真を見る（${photos.length}枚）</button>`:""}
    </div>
    <div class="record-b-right">${figure}</div>
   </div>
  </div>
 </div>`;
}
// V52: 20件制限は「記録」タブの一覧だけ。予定カレンダーとホーム→群の詳細→作業履歴は全件表示。

function newRecord(hiveId,presetWork,taskId){

function compressPhoto(file){return new Promise((resolve,reject)=>{
 const fr=new FileReader();
 fr.onload=()=>{const img=new Image();img.onload=()=>{
   const max=1200,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
   const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));
   const ctx=c.getContext("2d");ctx.drawImage(img,0,0,c.width,c.height);
   resolve(c.toDataURL("image/jpeg",0.65));
 };img.onerror=reject;img.src=fr.result};
 fr.onerror=reject;fr.readAsDataURL(file);
})}
async function saveRecord(){

 let real=+hive.realTiers||0,built=+hive.builtTiers||0,flowCount=+hive.flowCount||0,flowLevels=(hive.flowLevels||[]).slice(),created=[];

  }

  }
  if(type==="harvest"){
  const boxes=harvestSelectedTiers.slice().sort((a,b)=>a-b).filter(t=>t>=1&&t<=built);

  if(type==="addbox"){const ab=+document.getElementById("addBoxes")?.value||0,af=+document.getElementById("addFlows")?.value||0;real+=ab;flowCount+=af;for(let i=0;i<af;i++)flowLevels.push("空");rec.addBoxes=ab;rec.addFlows=af}

 try{save()}catch(e){
   data.records.splice(data.records.length-created.length,created.length);
   alert("写真の容量が大きすぎて保存できませんでした。写真を少なくしてもう一度登録してください。");

function taskDateLabel(d){try{return new Date(d+"T00:00:00").toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",weekday:"short"})}catch(e){return d}}
function monthCalendar(tasks,records){
 const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+scheduleMonthOffset);
 const y=base.getFullYear(),mo=base.getMonth(),first=new Date(y,mo,1).getDay(),last=new Date(y,mo+1,0).getDate();
 const names=["日","月","火","水","木","金","土"],td=today();
 const cells=Array.from({length:first},()=>`<div class="month-cell blank"></div>`);
 for(let d=1;d<=last;d++){
  const ds=`${y}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const hasTask=tasks.some(t=>t.date===ds&&!t.done);
  const hasRecord=records.some(r=>r.date===ds);
  const marks=(hasTask||hasRecord)?`<div class="calendar-marks">${hasTask?'<i class="calendar-dot task"></i>':''}${hasRecord?'<i class="calendar-dot record"></i>':''}</div>`:'';
  cells.push(`<div class="month-cell ${ds===td?"today":""} ${scheduleSelectedDate===ds?"selected":""}" onclick="selectScheduleDate('${ds}')">${d}${marks}</div>`);
 }
 return `<div class="week-card"><div class="month-nav"><button type="button" onclick="changeScheduleMonth(-1)">◀</button><div class="month-title">${y}年 ${mo+1}月</div><button type="button" onclick="changeScheduleMonth(1)">▶</button></div><div class="month-grid">${names.map(n=>`<div class="week-day">${n}</div>`).join("")}${cells.join("")}</div><div class="calendar-legend"><span><i class="task"></i>予定</span><span><i class="record"></i>作業記録</span></div></div>`;
}

 const types=["inspection","harvest","addbox","medicine","remove","move","other"];
 m.innerHTML=`<button class="secondary back" onclick="closeScheduleForm()">← 戻る</button><h2 class="schedule-form-title">📅 予定を追加</h2><div class="schedule-form"><div class="card"><label>日付</label><input id="taskDate" type="date" value="${today()}"><label>時間（任意）</label><input id="taskTime" type="time"></div><div class="card"><label>巣箱</label><select id="taskHive"><option value="">選択してください</option>${activeHives().map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join("")}</select><label>作業内容</label><div class="schedule-work-grid">${types.map(t=>`<button type="button" data-work="${t}" class="${t===scheduleWork?"selected":""}" onclick="selectScheduleWork('${t}')">${t==="other"?"その他":workLabel(t)}</button>`).join("")}</div><div id="otherTaskArea"><label>その他の作業名</label><input id="taskOther" placeholder="例：草刈り"></div></div><div class="card"><label>メモ</label><textarea id="taskMemo" rows="4" placeholder="例：王台と貯蜜量を確認"></textarea></div><button class="schedule-save" onclick="saveTaskV47()">保存</button></div>`;
 document.getElementById("otherTaskArea").style.display=scheduleWork==="other"?"block":"none";
 const obs=new MutationObserver(()=>{const a=document.getElementById("otherTaskArea");if(a)a.style.display=scheduleWork==="other"?"block":"none"});obs.observe(document.querySelector('.schedule-work-grid'),{attributes:true,subtree:true,attributeFilter:['class']});
}
function saveTaskV47(){const date=document.getElementById("taskDate").value,hiveId=document.getElementById("taskHive").value,time=document.getElementById("taskTime").value,memo=document.getElementById("taskMemo").value.trim(),other=document.getElementById("taskOther")?.value.trim()||"";if(!date)return alert("日付を入力してください");if(scheduleWork!=="other"&&!hiveId)return alert("巣箱を選択してください");if(scheduleWork==="other"&&!other)return alert("作業名を入力してください");data.tasks.push({id:crypto.randomUUID(),date,time,hiveId,workType:scheduleWork,workLabel:scheduleWork==="other"?other:"",memo,done:false,createdAt:Date.now()});save();scheduleEditing=false;render()}
function startTaskRecord(id){const t=(data.tasks||[]).find(x=>x.id===id);if(!t)return;if(!t.hiveId)return alert("巣箱が設定されていません");newRecord(t.hiveId,t.workType,id)}
function toggleTaskDone(id){const t=(data.tasks||[]).find(x=>x.id===id);if(!t)return;t.done=!t.done;t.completedAt=t.done?Date.now():null;save();render()}
function deleteTask(id){const i=(data.tasks||[]).findIndex(x=>x.id===id);if(i<0)return;if(!confirm("この予定を削除しますか？"))return;data.tasks.splice(i,1);save();render()}
function addTask(){saveTaskV47()}
function delTask(i){if(data.tasks?.[i])deleteTask(data.tasks[i].id)}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;editingHive=null;selectedHive=null;scheduleEditing=false;render()});render();
</script>

<script id="record-swipe-delete-js-v2">
(function(){
 let startX=0,startY=0,active=null,moved=false;
 document.addEventListener('touchstart',function(e){
   const card=e.target.closest('.record-swipe'); if(!card)return;
   const t=e.touches[0]; startX=t.clientX; startY=t.clientY; active=card; moved=false;
 },{passive:true});
 document.addEventListener('touchmove',function(e){
   if(!active)return; const t=e.touches[0];
   if(Math.abs(t.clientX-startX)>8 || Math.abs(t.clientY-startY)>8)moved=true;
 },{passive:true});
 document.addEventListener('touchend',function(e){
   if(!active)return; const t=e.changedTouches[0];
   const dx=t.clientX-startX, dy=t.clientY-startY;
   if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.2){
     if(dx<0)active.classList.add('open'); else active.classList.remove('open');
   }
   active=null; moved=false;
 },{passive:true});
 document.addEventListener('click',function(e){
   if(e.target.closest('.record-delete'))return;
   const card=e.target.closest('.record-swipe');
   if(card && card.classList.contains('open')){
     if(e.target.closest('button,a,input,label'))return;
     card.classList.remove('open');
   }
 });
 window.deleteRecord=function(id){
   if(!id)return;
   const latest=latestRecordId();
   if(id!==latest)return alert('作業記録は最新のものから順に削除してください。');
   const i=data.records.findIndex(r=>r.id===id);if(i<0)return;
   const r=data.records[i],h=data.hives.find(x=>x.id===r.hiveId);
   if(!confirm('最新の作業記録を削除しますか？\n\nこの作業を無かったことにして、巣箱の状態も作業前に戻します。'))return;
   if(h){
     let st=r.beforeState;
     if(!st){
       const prev=data.records.filter((x,j)=>j!==i&&x.hiveId===r.hiveId).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0))[0];
       if(prev)st={status:prev.status||h.status,place:prev.movePlace||h.place,realTiers:prev.realTiers,builtTiers:prev.builtTiers,flowCount:prev.flowCount,flowHive:prev.flowHive,flowLevels:prev.flowLevels};
     }
     if(st){
       h.status=st.status??h.status;h.place=st.place??h.place;h.realTiers=Number(st.realTiers??h.realTiers);h.builtTiers=Number(st.builtTiers??h.builtTiers);h.flowCount=Number(st.flowCount??h.flowCount);h.flowHive=st.flowHive!=null?!!st.flowHive:h.flowCount>0;h.flowLevels=Array.isArray(st.flowLevels)?st.flowLevels.slice():h.flowLevels;
     }else{
       if(r.workType==='addbox'){h.realTiers=Math.max(0,(+h.realTiers||0)-(+r.addBoxes||0));const n=+r.addFlows||0;if(n){h.flowLevels=(h.flowLevels||[]).slice(0,Math.max(0,(h.flowLevels||[]).length-n));h.flowCount=h.flowLevels.length;h.flowHive=h.flowCount>0}}
       if(r.workType==='harvest'){h.realTiers=(+h.realTiers||0)+(+r.harvestBoxes||0);h.builtTiers=(+h.builtTiers||0)+(+r.harvestBoxes||0)}
       if(r.workType==='move'&&r.moveFromPlace)h.place=r.moveFromPlace;
     }
   }
   data.records.splice(i,1);save();render();
 };
})();
</script>
