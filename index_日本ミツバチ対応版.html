<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5b400">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>🐝 養蜂管理</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--ink:#222;--muted:#777;--accent:#f5b400;--line:#e8e8e3;--danger:#d9534f}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:84px}
header{padding:18px 18px 10px;background:var(--card);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0}.date{font-size:13px;color:var(--muted);margin-top:4px}
main{padding:16px}.section-title{font-weight:700;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{font-size:22px;display:block;margin-top:4px}.muted{color:var(--muted);font-size:13px}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;background:var(--accent);color:#222}
button.secondary{background:#eee}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}
.nav button{background:transparent;border-radius:0;flex:1;max-width:180px;font-size:12px;color:#666;padding:10px 4px 12px}
.nav button.active{color:#111}.nav span{display:block;font-size:21px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;background:#fff;font-size:16px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.hive{margin-bottom:10px}.hive-head{display:flex;justify-content:space-between;align-items:center}.badge{padding:5px 8px;border-radius:99px;background:#fff3c7;font-size:12px}
.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}
.hidden{display:none!important}.back{margin-bottom:12px}.photo-preview{max-width:100%;border-radius:12px;margin-top:8px}
.small{font-size:12px}.danger{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

.flow-wrap{margin-top:12px}
.flow-title{font-weight:700;margin-bottom:8px}
.flow-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.flow-item{min-width:76px;text-align:center}
.flow-frame{height:116px;border:4px solid #9b6b32;border-radius:8px;background:#f5f0df;position:relative;padding:7px 5px;box-shadow:inset 0 0 0 2px #d5b57c}
.flow-frame:before,.flow-frame:after{content:"";position:absolute;left:11px;right:11px;height:2px;background:#c9a86f}
.flow-frame:before{top:34px}.flow-frame:after{top:68px}
.flow-frame .honey{position:absolute;left:9px;right:9px;bottom:9px;height:0;border-radius:5px;background:#f5b400;opacity:.85}
.flow-frame[data-level="少ない"] .honey{height:18%}
.flow-frame[data-level="半分"] .honey{height:43%}
.flow-frame[data-level="多い"] .honey{height:68%}
.flow-frame[data-level="満杯"] .honey{height:88%}
.flow-label{font-size:12px;font-weight:700;margin-top:4px}
.flow-level{font-size:11px;color:var(--muted);margin-top:2px}
.box-stack{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.box-tier{height:38px;border:2px solid #9b6b32;border-radius:6px;background:#eee8d6;display:flex;align-items:center;justify-content:center;font-size:12px}
.box-tier.built{background:#f5d36b;font-weight:700}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div class="app">
<header><h1>🐝 養蜂管理</h1><div class="date" id="today"></div></header>
<main id="main"></main>
<nav class="nav">
<button data-tab="home" class="active">🏠<span>ホーム</span></button>
<button data-tab="hives">🐝<span>巣箱</span></button>
<button data-tab="records">📝<span>記録</span></button>
<button data-tab="calendar">📅<span>予定</span></button>
</nav>
</div>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
const KEY="beeManagerV1";
let data=JSON.parse(localStorage.getItem(KEY)||'{"hives":[],"records":[],"tasks":[]}');
data.hives=(data.hives||[]).map(h=>({...h,realTiers:h.realTiers??0,builtTiers:h.builtTiers??0,flowHive:!!h.flowHive,flowCount:h.flowCount??0,flowLevels:h.flowLevels||[]}));
data.records=(data.records||[]).map(r=>({...r,realTiers:r.realTiers??0,builtTiers:r.builtTiers??0,flowHive:!!r.flowHive,flowCount:r.flowCount??0,flowLevels:r.flowLevels||[]}));

let currentTab="home", editingHive=null, selectedHive=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const today=()=>new Date().toISOString().slice(0,10);
document.getElementById("today").textContent=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});

function render(){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab));
 const m=document.getElementById("main");
 if(currentTab==="home") home(m); else if(currentTab==="hives") hives(m); else if(currentTab==="records") records(m); else calendar(m);
}
function home(m){
 const recent=[...data.records].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
 m.innerHTML=`<div class="grid">
 <div class="stat">🐝 巣箱<b>${data.hives.length}群</b></div>
 <div class="stat">📝 内検<b>${data.records.length}件</b></div>
 </div>
 <div class="section-title">今日の予定</div>
 <div class="card"><div class="row"><div><b>内検・作業を記録</b><div class="muted">巣箱の状態を残しておきましょう</div></div><button onclick="currentTab='records';render()">記録する</button></div></div>
 <div class="section-title">最近の記録</div>
 ${recent.length?recent.map(r=>recordCard(r)).join(""):'<div class="card empty">まだ記録がありません</div>'}
 <div class="section-title">クイック操作</div>
 <div class="row"><button onclick="addHive()">＋ 巣箱を追加</button><button class="secondary" onclick="newRecord()">📝 内検記録</button></div>`;
}
function hives(m){
 if(editingHive!==null){hiveForm(m);return}
 m.innerHTML=`<div class="row"><div><h2 style="margin:0">巣箱</h2><div class="muted">登録した巣箱を管理</div></div><button onclick="addHive()">＋ 追加</button></div>
 <div style="margin-top:14px">${data.hives.length?data.hives.map(h=>hiveCard(h)).join(""):'<div class="card empty">まだ巣箱がありません。<br>「＋ 追加」から登録できます。</div>'}</div>`;
}
function hiveCard(h){
 const rs=data.records.filter(r=>r.hiveId===h.id).sort((a,b)=>b.date.localeCompare(a.date));
 const last=rs[0];
 const real=Number(h.realTiers||0), built=Math.min(Number(h.builtTiers||0),real);
 const tiers=Array.from({length:real},(_,i)=>`<div class="box-tier ${i<built?"built":""}">${i<built?"巣あり":"空段"}・${i+1}段目</div>`).join("");
 const flows=h.flowHive?Array.from({length:Number(h.flowCount||0)},(_,i)=>flowMini(h,i)): "";
 return `<div class="card hive"><div class="hive-head"><b>🐝 ${esc(h.name)}</b><span class="badge">${esc(h.status||"未設定")}</span></div>
 <div class="muted">設置場所：${esc(h.place||"未設定")}</div>
 <div class="small">重箱：実段数 ${real}段／巣あり ${built}段（上から）</div>
 <div class="box-stack">${tiers||'<div class="hint">重箱の段数未設定</div>'}</div>
 ${h.flowHive?`<div class="flow-wrap"><div class="flow-title">🍯 フローハイブ ${esc(h.flowCount||0)}基</div><div class="flow-row">${flows}</div><div class="hint">左から1基目、2基目…の順。タップして貯蜜状況を変更できます。</div></div>`:'<div class="hint">フローハイブ：なし</div>'}
 <div class="small" style="margin-top:8px">最終内検：${last?esc(last.date):"まだなし"}</div>
 <div class="actions"><button onclick="viewHive('${h.id}')">詳細</button><button class="secondary" onclick="editHive('${h.id}')">編集</button></div></div>`;
}
function flowMini(h,i){
 const levels=h.flowLevels||[];
 const level=levels[i]||"空";
 return `<div class="flow-item" onclick="cycleFlow('${h.id}',${i})"><div class="flow-frame" data-level="${esc(level)}"><div class="honey"></div></div><div class="flow-label">基 ${i+1}</div><div class="flow-level">${esc(level)}</div></div>`;
}
function cycleFlow(id,i){
 const h=data.hives.find(x=>x.id===id); if(!h)return;
 const seq=["空","少ない","半分","多い","満杯"];
 h.flowLevels=h.flowLevels||[];
 h.flowLevels[i]=seq[(seq.indexOf(h.flowLevels[i]||"空")+1)%seq.length];
 save();render();
}
function hiveForm(m){
 const h=editingHive==="new"?{}:data.hives.find(x=>x.id===editingHive)||{};
 const real=Number(h.realTiers||0), built=Math.min(Number(h.builtTiers||0),real);
 m.innerHTML=`<button class="secondary back" onclick="editingHive=null;render()">← 戻る</button><h2>${editingHive==="new"?"巣箱を追加":"巣箱を編集"}</h2>
 <label>巣箱名・番号</label><input id="hn" value="${esc(h.name||"")}" placeholder="例：巣箱01">
 <label>設置場所</label><input id="hp" value="${esc(h.place||"")}" placeholder="例：○○畑">
 <label>群の状態</label><select id="hs"><option ${h.status==="強群"?"selected":""}>強群</option><option ${h.status==="普通"?"selected":""}>普通</option><option ${h.status==="弱群"?"selected":""}>弱群</option><option ${!h.status?"selected":""}>未設定</option></select>
 <label>重箱の実段数</label><input id="hr" type="number" min="0" max="20" value="${esc(h.realTiers||"")}" placeholder="例：5">
 <label>巣が出来ている段数（上から）</label><input id="hb" type="number" min="0" max="20" value="${esc(h.builtTiers||"")}" placeholder="例：3">
 <div class="hint">「巣あり」は重箱の上から数えます。</div>
 <label>フローハイブ</label><select id="hflow"><option value="false" ${!h.flowHive?"selected":""}>なし</option><option value="true" ${h.flowHive?"selected":""}>あり</option></select>
 <label>フローハイブ設置枚数（基）</label><input id="hfc" type="number" min="0" max="10" value="${esc(h.flowCount||"")}" placeholder="例：4〜5">
 <div class="hint">基本は分蜂後に4〜5基を設置し、9〜10月ごろ取り外す運用を想定。</div>
 <label>メモ</label><textarea id="hm" rows="4">${esc(h.memo||"")}</textarea>
 <button style="width:100%;margin-top:14px" onclick="saveHive()">保存</button>`;
}
function addHive(){editingHive="new";currentTab="hives";render()}
function editHive(id){editingHive=id;render()}
function saveHive(){
 const name=document.getElementById("hn").value.trim(); if(!name){alert("巣箱名・番号を入力してください");return}
 let real=Math.max(0,Number(document.getElementById("hr").value||0));
 let built=Math.max(0,Math.min(real,Number(document.getElementById("hb").value||0)));
 let flowHive=document.getElementById("hflow").value==="true";
 let flowCount=flowHive?Math.max(0,Number(document.getElementById("hfc").value||0)):0;
 const old=editingHive==="new"?{}:(data.hives.find(x=>x.id===editingHive)||{});
 let flowLevels=Array.isArray(old.flowLevels)?old.flowLevels.slice(0,flowCount):[];
 while(flowLevels.length<flowCount)flowLevels.push("空");
 const obj={id:editingHive==="new"?crypto.randomUUID():editingHive,name,place:document.getElementById("hp").value,status:document.getElementById("hs").value,realTiers:real,builtTiers:built,flowHive,flowCount,flowLevels,memo:document.getElementById("hm").value};
 if(editingHive==="new") data.hives.push(obj); else data.hives[data.hives.findIndex(x=>x.id===editingHive)]=obj;
 save();editingHive=null;render();
}
function viewHive(id){
 selectedHive=id; const h=data.hives.find(x=>x.id===id); const rs=data.records.filter(r=>r.hiveId===id).sort((a,b)=>b.date.localeCompare(a.date));
 const real=Number(h.realTiers||0), built=Math.min(Number(h.builtTiers||0),real);
 const tiers=Array.from({length:real},(_,i)=>`<div class="box-tier ${i<built?"built":""}">${i<built?"巣あり":"空段"}・${i+1}段目</div>`).join("");
 const flows=h.flowHive?Array.from({length:Number(h.flowCount||0)},(_,i)=>flowMini(h,i)).join(""):"";
 document.getElementById("main").innerHTML=`<button class="secondary back" onclick="selectedHive=null;render()">← 巣箱一覧</button>
 <div class="card"><h2 style="margin-top:0">🐝 ${esc(h.name)}</h2><div>場所：${esc(h.place||"-")}</div><div>状態：${esc(h.status||"-")}</div>
 <div style="margin-top:8px"><b>重箱</b>：実段数 ${real}段／巣あり ${built}段（上から）</div><div class="box-stack">${tiers||'<div class="hint">未設定</div>'}</div>
 ${h.flowHive?`<div class="flow-wrap"><div class="flow-title">🍯 フローハイブ ${esc(h.flowCount||0)}基</div><div class="flow-row">${flows}</div><div class="hint">各基をタップすると貯蜜状況を変更できます。</div></div>`:'<div class="hint" style="margin-top:10px">フローハイブ：なし</div>'}
 <div class="muted" style="margin-top:10px">${esc(h.memo||"")}</div></div>
 <div class="section-title">内検履歴</div>${rs.length?rs.map(recordCard).join(""):'<div class="card empty">記録なし</div>'}
 <button style="width:100%;margin-top:10px" onclick="newRecord('${id}')">＋ この巣箱を内検記録</button>`;
}
function recordCard(r){
 const h=data.hives.find(x=>x.id===r.hiveId);
 const real=Number(r.realTiers||0), built=Number(r.builtTiers||0);
 return `<div class="card" style="margin-bottom:10px"><div class="hive-head"><b>${esc(r.date)}　${esc(h?.name||"削除済み")}</b><span class="badge">重箱 ${real}段</span></div>
 <div class="muted">巣あり：${built}段（上から）　フローハイブ：${r.flowHive?"あり":"なし"}${r.flowHive?`・${esc(r.flowCount||0)}基`:""}</div>
 ${r.flowLevels?.length?`<div class="small">貯蜜：${r.flowLevels.map((x,i)=>`基${i+1} ${esc(x)}`).join("　")}</div>`:""}
 <div class="small">${esc(r.memo||"")}</div>${r.photo?`<img class="photo-preview" src="${r.photo}">`:""}</div>`;
}
function records(m){
 const rs=[...data.records].sort((a,b)=>b.date.localeCompare(a.date));
 m.innerHTML=`<div class="row"><div><h2 style="margin:0">記録</h2><div class="muted">内検・作業の履歴</div></div><button onclick="newRecord()">＋ 内検</button></div>
 <div style="margin-top:14px">${rs.length?rs.map(recordCard).join(""):'<div class="card empty">まだ内検記録がありません。</div>'}</div>`;
}
function newRecord(hiveId){
 const m=document.getElementById("main");
 currentTab="records"; document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab==="records"));
 if(!data.hives.length){m.innerHTML='<div class="card empty">先に巣箱を登録してください。<br><br><button onclick="addHive()">巣箱を追加</button></div>';return}
 const h=data.hives.find(x=>x.id===hiveId)||data.hives[0];
 m.innerHTML=`<button class="secondary back" onclick="render()">← 戻る</button><h2>📝 内検記録</h2>
 <label>巣箱</label><select id="rh">${data.hives.map(x=>`<option value="${x.id}" ${x.id===h.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
 <label>日付</label><input id="rd" type="date" value="${today()}">
 <label>天気</label><select id="rw"><option>☀️ 晴れ</option><option>☁️ 曇り</option><option>🌧️ 雨</option></select>
 <label>気温（℃）</label><input id="rt" type="number" placeholder="28">
 <label>重箱の実段数</label><input id="rr" type="number" min="0" max="20" value="${esc(h.realTiers||"")}">
 <label>巣が出来ている段数（上から）</label><input id="rbuilt" type="number" min="0" max="20" value="${esc(h.builtTiers||"")}">
 <label>フローハイブ</label><select id="rflow"><option value="false" ${!h.flowHive?"selected":""}>なし</option><option value="true" ${h.flowHive?"selected":""}>あり</option></select>
 <label>フローハイブ設置枚数（基）</label><input id="rfc" type="number" min="0" max="10" value="${esc(h.flowCount||"")}">
 <div id="flowRecordArea"></div>
 <label>給餌</label><select id="rfeed"><option>なし</option><option>あり</option></select>
 <label>写真</label><input id="rphoto" type="file" accept="image/*" capture="environment">
 <img id="preview" class="photo-preview hidden">
 <label>メモ</label><textarea id="rm" rows="5" placeholder="気になったことなど"></textarea>
 <button style="width:100%;margin-top:14px" onclick="saveRecord()">記録する</button>`;
 const updateFlowRecord=()=>{
   const area=document.getElementById("flowRecordArea"), on=document.getElementById("rflow").value==="true", n=on?Math.max(0,Number(document.getElementById("rfc").value||0)):0;
   area.innerHTML=on?`<label>フローハイブ各基の貯蜜状況</label><div class="flow-row">${Array.from({length:n},(_,i)=>`<div class="flow-item"><div class="flow-frame" id="rf${i}" data-level="空" onclick="cycleRecordFlow(${i})"><div class="honey"></div></div><div class="flow-label">基 ${i+1}</div><div class="flow-level" id="rfl${i}">空</div></div>`).join("")}</div>`:"";
 };
 document.getElementById("rflow").onchange=updateFlowRecord; document.getElementById("rfc").oninput=updateFlowRecord; updateFlowRecord();
 document.getElementById("rphoto").onchange=e=>{const f=e.target.files[0];if(f){const rd=new FileReader();rd.onload=()=>{const p=document.getElementById("preview");p.src=rd.result;p.classList.remove("hidden")};rd.readAsDataURL(f)}};
}
function cycleRecordFlow(i){
 const el=document.getElementById("rf"+i), lab=document.getElementById("rfl"+i), seq=["空","少ない","半分","多い","満杯"];
 const next=seq[(seq.indexOf(el.dataset.level)+1)%seq.length]; el.dataset.level=next; lab.textContent=next;
}
function saveRecord(){
 const file=document.getElementById("rphoto").files[0];
 const finish=photo=>{
   const hive=data.hives.find(x=>x.id===document.getElementById("rh").value);
   const real=Math.max(0,Number(document.getElementById("rr").value||0));
   const built=Math.max(0,Math.min(real,Number(document.getElementById("rbuilt").value||0)));
   const flowHive=document.getElementById("rflow").value==="true";
   const flowCount=flowHive?Math.max(0,Number(document.getElementById("rfc").value||0)):0;
   const flowLevels=flowHive?Array.from({length:flowCount},(_,i)=>document.getElementById("rf"+i)?.dataset.level||"空"):[];
   data.records.push({id:crypto.randomUUID(),hiveId:hive.id,date:document.getElementById("rd").value,weather:document.getElementById("rw").value,temp:document.getElementById("rt").value,realTiers:real,builtTiers:built,flowHive,flowCount,flowLevels,feed:document.getElementById("rfeed").value,photo:photo||"",memo:document.getElementById("rm").value});
   hive.realTiers=real; hive.builtTiers=built; hive.flowHive=flowHive; hive.flowCount=flowCount; hive.flowLevels=flowLevels;
   save();render();
 };
 if(file){const rd=new FileReader();rd.onload=()=>finish(rd.result);rd.readAsDataURL(file)}else finish("");
}
function calendar(m){
 const upcoming=data.tasks||[];
 m.innerHTML=`<h2>📅 予定</h2><div class="card"><label>作業内容</label><input id="tn" placeholder="例：巣箱01 内検"><label>日付</label><input id="td" type="date" value="${today()}"><button style="width:100%;margin-top:12px" onclick="addTask()">予定を追加</button></div>
 <div class="section-title">予定一覧</div>${upcoming.sort((a,b)=>a.date.localeCompare(b.date)).map((t,i)=>`<div class="card" style="margin-bottom:8px"><b>${esc(t.date)}</b>　${esc(t.name)} <button class="secondary small" style="float:right;padding:6px 9px" onclick="delTask(${i})">削除</button></div>`).join("")||'<div class="card empty">予定はありません</div>'}`;
}
function addTask(){const n=document.getElementById("tn").value.trim(),d=document.getElementById("td").value;if(!n)return alert("作業内容を入力してください");data.tasks.push({name:n,date:d});save();render()}
function delTask(i){data.tasks.splice(i,1);save();render()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;editingHive=null;selectedHive=null;render()});
render();
</script>
</body>
</html>
